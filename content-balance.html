    const sel = SubtopicPicker({ catId: i.catId, subId: i.subId });
    const saveIt = () => {
      const v = ta.value.trim(); if (!v) { ta.focus(); return; }
      const { catId: nc, subId: ns } = sel.value; const moved = nc !== i.catId || ns !== i.subId;
      Object.assign(i, { title: v, note: note.value.trim(), catId: nc, subId: ns, updatedAt: Date.now() }); ctx.setEditing(null); commit();
      if (moved) toast(`Перенесено в «${cat(nc).name} › ${subOf(nc, ns).name}»`, { action: 'Открыть', onAction: () => go({ level: 'sub', catId: nc, subId: ns }, { dir: 'in' }) });
    };
    // Enter — новая строка (сценарии многострочные), Ctrl/⌘+Enter — сохранить
    ta.addEventListener('keydown', e => { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); saveIt(); } if (e.key === 'Escape') ctx.setEditing(null); });
    li.append(h('div.edit-form', {}, ta, note, h('div.row', {}, sel.el, h('button.btn', { onclick: saveIt }, 'Сохранить'), h('button.btn.secondary', { onclick: () => ctx.setEditing(null) }, 'Отмена'))));
    setTimeout(() => ta.focus(), 30);
    return li;
  }
  const body = h('div.body', {},
    ctx.showPlace && c ? h('div.place', {}, h('span.dot', { style: `background:${sb ? subColor(c, sb) : c.color}` }), `${c.name} › ${sb ? sb.name : '—'}`) : null,
    h('div.title', {}, i.title), i.note ? h('div.note', {}, i.note) : null);
  const acts = h('div.acts', {},
    h('button', { title: 'Редактировать', onclick: () => ctx.setEditing(i.id) }, icon('edit')),
    h('button.del', { title: 'Удалить', onclick: () => removeIdea(i, li) }, icon('trash')));
  const foot = h('div.idea-foot'), meta = h('div.meta');
  if (st === 'todo') {
    meta.append(h('span', {}, `добавлено ${fmtDate(i.createdAt)}`));
    foot.append(h('button.st-btn', { onclick: () => markDone(i) }, icon('check'), 'Снято'), meta);
  } else if (st === 'done') {
    meta.append(h('span.done-tag', {}, `✓ снято ${fmtDate(i.doneAt || i.createdAt)}`));
    foot.append(h('button.st-btn.pub', { onclick: e => markPublished(i, e) }, icon('send'), 'Опубликовано'),
      h('button.st-link', { onclick: () => unDone(i) }, '← в очередь'), meta);
  } else {
    meta.append(h('span.done-tag', {}, `📣 опубликовано ${fmtDate(pubAt(i))}`));
    if (ctx.rank) meta.append(h('span.rank-tag', { class: ctx.rank.rank === 1 ? 'top' : '', title: 'Место в рейтинге подтемы · индекс 0–100' }, `№${ctx.rank.rank} из ${ctx.rank.of}`, h('small', {}, String(ctx.rank.score))));
    if (isStories(sb)) foot.append(h('span.stat-note', {}, 'сторис · в статистику не входит'));
    else {
      if (hasStats(i.stats)) foot.append(statChips(i.stats));
      foot.append(h('button.st-btn.secondary', { onclick: e => openStatsSheet(i, e) }, icon('chart'), hasStats(i.stats) ? 'Изменить статистику' : 'Добавить статистику'));
    }
    foot.append(h('button.st-link', { onclick: () => unPublish(i) }, '← в снятые'), meta);
  }
  li.append(h('div.main', {}, body, acts), foot);
  return li;
}
function statChips(st) {
  const box = h('div.stat-chips');
  for (const [k, lbl, ic] of METRICS) box.append(h('span.stat-chip', { title: lbl }, ic, fmtInt(+st[k] || 0)));
  const er = erOf(st);
  if (er != null) box.append(h('span.stat-chip', { title: 'ER — все реакции ÷ просмотры' }, 'ER', h('small', {}, fmtPct(er))));
  return box;
}
/* сводка по набору опубликованных: сколько вышло, сумма и среднее по каждой метрике, ER */
function statsBlock(a) {
  const box = h('div');
  box.append(h('div.stats-sum', {}, h('div.big', {}, String(a.n), h('small', {}, `${plural(a.n, 'ролик опубликован', 'ролика опубликовано', 'роликов опубликовано')}${a.n ? ` · статистика есть у ${a.withStats}` : ''}`))));
  if (!a.n) { box.append(h('div.stats-note', {}, 'Опубликованных роликов пока нет — статистика появится, когда что-то выйдет.')); return box; }
  const grid = h('div.stats-grid');
  for (const [k, lbl, ic] of METRICS)
    grid.append(h('div.stat-tile', {}, h('div.k', {}, `${ic} ${lbl}`), h('div.v', {}, fmtInt(a[k])), h('div.a', {}, a.withStats ? `≈ ${fmtInt(a[k] / a.withStats)} на ролик` : 'нет данных')));
  grid.append(h('div.stat-tile.er', {}, h('div.k', {}, '📈 ER'), h('div.v', {}, fmtPct(a.er)), h('div.a', {}, 'реакции ÷ просмотры')));
  box.append(grid);
  if (a.withStats < a.n) box.append(h('div.stats-note', {}, `У ${a.n - a.withStats} ${plural(a.n - a.withStats, 'ролика', 'роликов', 'роликов')} статистика ещё не добавлена — нажми «Добавить статистику» в карточке.`));
  return box;
}

/* рейтинг роликов: ранжированный список с индексом и короткие выводы —
   кто лучший, насколько оторвался, кто приносит подписчиков и вовлечённость.
   opts: title; col — цвет полосок (для подтемы), иначе цвет подтемы каждого ролика;
   showPlace — подписывать подтему в строке (общий рейтинг); limit — сколько строк показать сразу */
function ratingCard(rating, opts = {}) {
  const { rows, axes } = rating, scope = opts.scope || 'в подтеме';
  const rowCol = r => opts.col || (() => { const c = cat(r.i.catId), sb = subOf(r.i.catId, r.i.subId); return c ? (sb ? subColor(c, sb) : c.color) : 'var(--ink-3)'; })();
  const card = h('div.card.rate-card');
  card.append(h('div.an-head', {}, h('h3', {}, opts.title || 'Рейтинг роликов'),
    h('span.rate-axes', { title: 'Индекс 0–100: доля от лучшего по каждой оси, среднее по осям' }, axes.map(a => a.lbl).join(' · '))));

  // --- выводы ---
  const verdict = h('div.rate-verdict');
  const first = t => t.title.split('\n')[0].replace(/\s+/g, ' ').trim();
  const q = i => `«${first(i).slice(0, 70)}${first(i).length > 70 ? '…' : ''}»`;
  const line = (ic, ...kids) => verdict.append(h('div.ln', {}, h('span.ic', {}, ic), h('span', {}, ...kids)));
  const best = rows[0], bs = best.i.stats;
  if (rows.length === 1) {
    line('🏆', 'Пока один ролик со статистикой — ', h('b', {}, q(best.i)), '. Сравнивать не с чем: впиши цифры остальным, и рейтинг оживёт.');
  } else {
    const bits = [`${fmtInt(bs.views)} просмотров`];
    if (erOf(bs) != null) bits.push(`ER ${fmtPct(erOf(bs))}`);
    if (+bs.followers > 0) bits.push(`+${fmtInt(bs.followers)} подписчиков`);
    line('🏆', 'Лучший — ', h('b', {}, q(best.i)), `: ${bits.join(', ')}.`);
    // отрыв лидера по просмотрам от медианы: большой — тема «выстрелила», малый — ролики идут ровно
    const views = rows.map(r => +r.i.stats.views || 0).sort((a, b) => a - b), med = views[Math.floor(views.length / 2)];
    const ratio = med > 0 ? (+bs.views || 0) / med : 0;
    if (ratio >= 2) line('🚀', 'Лидер собрал в ', h('b', {}, fmtX(ratio)), ' больше просмотров, чем типичный ролик — такой формат или тему стоит повторить.');
    else if (med > 0) line('📊', `Ролики идут ровно: лидер обошёл типичный ролик лишь в ${fmtX(ratio)}. Резких удач пока нет — пробуй новые хуки.`);
    // общий рейтинг: какая подтема держит верх таблицы
    if (opts.showPlace && rows.length >= 3) {
      const cnt = {}; for (const r of rows.slice(0, 3)) { const k = r.i.catId + '/' + r.i.subId; cnt[k] = (cnt[k] || 0) + 1; }
      const [k, n] = Object.entries(cnt).sort((a, b) => b[1] - a[1])[0];
      const sbTop = subOf(...k.split('/'));
      if (n >= 2 && sbTop) line('🎯', `В топ-3 ${n === 3 ? 'все три ролика' : 'два ролика'} из `, h('b', {}, `«${sbTop.name}»`), ' — эта подтема сейчас работает лучше всех, давай ей больше места.');
    }
    const byF = rows.filter(r => +r.i.stats.followers > 0).sort((a, b) => +b.i.stats.followers - +a.i.stats.followers)[0];
    if (byF && byF !== best) line('👤', 'Подписчиков приносит лучше всех ', h('b', {}, q(byF.i)), ` — +${fmtInt(byF.i.stats.followers)}, ${convOf(byF.i.stats).toFixed(1).replace('.', ',')} на 1 000 просмотров.`);
    const byEr = rows.filter(r => erOf(r.i.stats) != null).sort((a, b) => erOf(b.i.stats) - erOf(a.i.stats))[0];
    if (byEr && byEr !== best && byEr !== byF) line('💬', 'Сильнее всего вовлекает ', h('b', {}, q(byEr.i)), ` — ER ${fmtPct(erOf(byEr.i.stats))} при ${fmtInt(byEr.i.stats.views)} просмотрах.`);
    const weak = rows.filter(r => r.score < 35).length;
    if (weak) line('⚠️', `${weak} ${plural(weak, 'ролик заметно слабее', 'ролика заметно слабее', 'роликов заметно слабее')} лидера (индекс ниже 35) — посмотри, что у них общего: хук, длина, тема.`);
  }
  card.append(verdict);

  // --- список ---
  const list = h('div.rate-list');
  const avg = rows.reduce((a, r) => a + r.score, 0) / rows.length;
  const limit = opts.limit || rows.length;
  let expanded = false;
  const more = rows.length > limit ? h('button.rate-more', { type: 'button', onclick: () => { expanded = !expanded; draw(); } }) : null;
  function draw() {
    list.innerHTML = '';
    for (const r of expanded ? rows : rows.slice(0, limit)) {
      const st = r.i.stats, er = erOf(st), col = rowCol(r), sb = subOf(r.i.catId, r.i.subId);
      const sub = [fmtDate(pubAt(r.i)), `👁 ${fmtInt(st.views)}`];
      if (er != null) sub.push(`ER ${fmtPct(er)}`);
      if (+st.followers > 0) sub.push(`👤 +${fmtInt(st.followers)}`);
      if (opts.showPlace && sb) sub.unshift(sb.name);
      list.append(h('button.rate-row', { type: 'button', class: r.rank === 1 ? 'top' : '', title: 'Изменить статистику', onclick: e => openStatsSheet(r.i, e) },
        h('span.num', { style: `background:${r.rank === 1 ? col : 'var(--surface-3)'};color:${r.rank === 1 ? '#fff' : 'var(--ink-2)'}` }, String(r.rank)),
        h('span.t', {}, first(r.i), h('small', {}, sub.join(' · '))),
        h('span.sc', {}, String(r.score), h('small', {}, '/100')),
        h('span.track', {}, h('i', { style: `width:${r.score}%;background:${col}` }), h('span.avg', { style: `left:${avg}%`, title: `среднее ${Math.round(avg)}` }))));
    }
    if (more) more.textContent = expanded ? 'Свернуть' : `Показать все ${rows.length}`;
  }
  draw();
  card.append(list, ...(more ? [more] : []), h('p.an-foot', {}, `Индекс считает, насколько ролик близок к лучшему ${scope} по каждой оси (${axes.map(a => a.lbl).join(', ')}) — 100 у того, кто лучший по всем. Штрих — среднее. Нажми на строку, чтобы поправить цифры.`));
  return card;
}

/* ===================================================================
   Операции с идеями
   =================================================================== */
function addIdea(catId, subId, title, note) {
  const idea = { id: uid(), catId, subId, title, note: note || '', createdAt: Date.now(), updatedAt: Date.now(), done: false, doneAt: null, published: false, publishedAt: null, stats: null };
  state.ideas.push(idea); commit();
  return idea;
}
/* в очереди → снято */
function markDone(i) {
  i.done = true; i.doneAt = Date.now(); i.updatedAt = Date.now(); commit();
  const key = nowKey(), n = doneInMonth(key).length, t = planFor(key);
  toast(t && n === t ? `🏆 ${n} из ${t} — план месяца выполнен!` : t ? `✓ Снято ${n} из ${t} в этом месяце` : `✓ Снято: ${n} в этом месяце`, { action: 'Отменить', onAction: () => unDone(i) });
}
/* снято → в очередь (публикация тоже снимается) */
function unDone(i) { i.done = false; i.doneAt = null; i.published = false; i.publishedAt = null; i.updatedAt = Date.now(); commit(); }
/* снято → опубликовано; сразу предлагаем вписать статистику */
function markPublished(i) {
  const now = Date.now();
  i.published = true; i.publishedAt = now; if (!i.done) { i.done = true; i.doneAt = now; } i.updatedAt = now; commit();
  if (isStoriesIdea(i)) toast('📣 Опубликовано');
  else toast('📣 Опубликовано · впиши статистику, когда появятся цифры', { action: 'Статистика', onAction: () => openStatsSheet(i) });
}
/* опубликовано → снято (статистика остаётся на случай возврата) */
function unPublish(i) { i.published = false; i.publishedAt = null; i.updatedAt = Date.now(); commit(); toast('Возвращено в «Снято»'); }

/* окно статистики опубликованного ролика: дата публикации и шесть метрик из Instagram */
function openStatsSheet(i, e) {
  const c = cat(i.catId);
  openSheet((sheet, close) => {
    sheet.style.setProperty('--accent', c ? c.color : 'var(--expert)');
    const inputs = {}, grid = h('div.stats-form');
    const date = h('input.date', { type: 'date', value: toDateInput(pubAt(i)) });
    const saveIt = () => {
      const stats = {};
      for (const [k] of METRICS) { const v = Math.round(parseFloat(String(inputs[k].value).replace(/\s/g, '').replace(',', '.'))); stats[k] = v > 0 ? v : 0; }
      i.stats = stats; i.statsAt = Date.now();
      const d = date.value ? new Date(date.value + 'T12:00:00').getTime() : NaN;
      if (!isNaN(d)) i.publishedAt = d;
      i.updatedAt = Date.now(); commit(); close(); toast('Статистика сохранена');
    };
    for (const [k, lbl, ic] of METRICS) {
      const inp = h('input', { type: 'number', inputmode: 'numeric', min: 0, step: 1, placeholder: '0', value: i.stats && +i.stats[k] > 0 ? i.stats[k] : '' });
      inp.addEventListener('keydown', ev => { if (ev.key === 'Enter') { ev.preventDefault(); saveIt(); } });
      inputs[k] = inp; grid.append(h('label', {}, `${ic} ${lbl}`, inp));
    }
    sheet.append(h('h3', {}, h('span.sw', { style: `background:${c ? c.color : 'var(--expert)'}` }), 'Статистика ролика'),
      h('p.txt', { style: 'font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis' }, i.title.replace(/\s+/g, ' ')),
      h('div.lbl', {}, 'Дата публикации'), date,
      h('div.lbl', {}, 'Показатели из Instagram'), grid,
      h('div.foot', {}, h('button.btn.secondary', { onclick: close }, 'Отмена'), h('button.btn', { onclick: saveIt }, 'Сохранить')));
    setTimeout(() => inputs.views.focus(), isPhone() ? 350 : 80);
  }, e);
}

/* ===================================================================
   Экран «Опубликованные»: отчёт по всем вышедшим роликам (без сторис),
   разбивка по подтемам, топ по просмотрам и общий список
   =================================================================== */
function PublishedView() {
  const el = h('div.view.pubv');
  let period = 0, editingId = null;
  const meta = h('span.meta'), filters = h('div.filters');
  const report = h('div.card'), rate = h('div.rate-slot'), bySub = h('div.card');
  const listHead = h('div.pub-list-head'), ul = h('ul.ideas');
  let rating = null;   // общий рейтинг по всем опубликованным за период
  el.append(
    h('div.view-head', {},
      h('button.back', { onclick: () => go({ level: 'home' }, { dir: 'out' }) }, icon('back'), 'Главная'),
      h('h2', {}, h('span.sw', { style: 'background:var(--good)' }), 'Опубликованные'), meta, h('span.spacer'), filters),
    report, rate, bySub, listHead, ul);
  const ctx = i => ({ editing: editingId === i.id, showPlace: true, rank: rating && rating.byId[i.id], setEditing: id => { editingId = id; update(); } });
  function update() {
    const since = period ? Date.now() - period * 864e5 : 0;
    const allPub = state.ideas.filter(i => i.published && pubAt(i) >= since).sort((a, b) => pubAt(b) - pubAt(a));
    const counted = allPub.filter(inStats), stories = allPub.length - counted.length;
    const shotAll = state.ideas.filter(i => i.done && !isStoriesIdea(i)).length;
    const waiting = state.ideas.filter(i => i.done && !i.published && !isStoriesIdea(i)).length;
    filters.innerHTML = '';
    for (const [d, lbl] of AN_PERIODS) filters.append(h('button', { class: period === d ? 'on' : '', onclick: () => { period = d; update(); } }, lbl));
    const periodTxt = period ? `за ${period} дней` : 'за всё время';
    meta.textContent = `${pVideos(counted.length)}${stories ? ` · сторис ${stories}` : ''}`;

    // --- отчёт ---
    const a = aggStats(counted);
    const [P, E] = state.categories;
    const nP = counted.filter(i => i.catId === P.id).length, nE = counted.length - nP, [sp, se] = shares([nP, nE]);
    report.innerHTML = '';
    report.append(
      h('div.an-head', {}, h('h3', {}, `Отчёт · ${periodTxt}`), h('button.ghost-btn', { onclick: () => copyReport(counted, a, periodTxt, rating) }, '📋 Скопировать отчёт для анализа')),
      statsBlock(a));
    const bar = h('div.bar');
    if (counted.length) bar.append(h('i.p', { style: `width:${sp}%` }), h('i.e', { style: `width:${se}%` }));
    report.append(bar, h('div.legend', {},
      h('div.it', {}, h('span.dot', { style: `background:${P.color}` }), `${P.name} `, h('b', {}, counted.length ? `${nP} · ${sp}%` : '0')),
      h('div.it', {}, h('span.dot', { style: `background:${E.color}` }), `${E.name} `, h('b', {}, counted.length ? `${nE} · ${se}%` : '0')),
      h('div.it', {}, 'Снято всего ', h('b', {}, shotAll), ' · ждут публикации ', h('b', {}, waiting))),
      h('p.an-foot', {}, 'Сторис в статистику не входят. ER = (лайки + комментарии + репосты + пересылки + сохранения) ÷ просмотры. «Подписалось» в ER не входит. «В среднем на ролик» — по роликам, у которых заполнена статистика.'));

    // --- по подтемам ---
    bySub.innerHTML = ''; bySub.append(h('h3', {}, 'По подтемам'));
    const rows = [];
    for (const c of state.categories) for (const sb of c.subtopics) {
      if (isStories(sb)) continue;
      const xs = counted.filter(i => i.catId === c.id && i.subId === sb.id);
      if (xs.length) rows.push({ c, sb, a: aggStats(xs) });
    }
    rows.sort((x, y) => y.a.n - x.a.n || y.a.views - x.a.views);
    if (!rows.length) bySub.append(h('div.empty', {}, 'Пока нечего сравнивать — опубликованных роликов нет.'));
    else {
      const tbody = h('tbody');
      for (const r of rows) tbody.append(h('tr.click', { title: `Открыть «${r.sb.name}»`, onclick: e => go({ level: 'sub', catId: r.c.id, subId: r.sb.id }, { dir: 'in', origin: originFromEl(e.currentTarget) }) },
        h('td', {}, h('span.nm', {}, h('span.dot', { style: `background:${subColor(r.c, r.sb)}` }), r.sb.name, h('small', {}, r.c.name.toLowerCase()))),
        h('td', {}, String(r.a.n)), ...METRICS.map(([k]) => h('td', {}, fmtInt(r.a[k]))), h('td', {}, fmtPct(r.a.er))));
      tbody.append(h('tr.tot', {}, h('td', {}, 'Итого'), h('td', {}, String(a.n)), ...METRICS.map(([k]) => h('td', {}, fmtInt(a[k]))), h('td', {}, fmtPct(a.er))));
      bySub.append(h('div.tbl-wrap', {}, h('table.tbl', {},
        h('thead', {}, h('tr', {}, h('th', {}, 'Подтема'), h('th', {}, 'Роликов'), ...METRICS.map(([k, lbl, ic]) => h('th', { title: lbl }, ic)), h('th', {}, 'ER'))),
        tbody)));
    }

    // --- общий рейтинг: все подтемы вместе, лидеры сверху ---
    rating = rateIdeas(counted);
    rate.innerHTML = '';
    rate.append(rating.rows.length ? ratingCard(rating, { title: `Рейтинг роликов · ${periodTxt}`, showPlace: true, limit: 7, scope: 'среди всех' })
      : h('div.card', {}, h('h3', {}, 'Рейтинг роликов'), h('div.empty', {}, 'Добавь статистику к роликам — здесь появятся лидеры.')));

    // --- список ---
    listHead.innerHTML = '';
    listHead.append(h('h3', {}, `Все опубликованные · ${allPub.length}`), h('span.spacer'), h('span.meta', {}, stories ? `из них сторис: ${stories} (без статистики)` : ''));
    ul.innerHTML = '';
    if (!allPub.length) ul.append(h('div.empty', {}, h('span', {}, `Опубликованных роликов ${periodTxt} нет. В подтеме на вкладке «Снято» нажми `, h('b', {}, '«Опубликовано»'), ' у вышедшего ролика.')));
    for (const i of allPub) ul.append(ideaCard(i, ctx(i)));
  }
  update();
  return { el, update, zoomTarget: () => null };
}
/* текстовый отчёт для вставки в чат — сводка, подтемы и каждый ролик с цифрами */
function copyReport(ideas, a, periodTxt, rating) {
  const d = new Date(), L = [];
  const metricsLine = s => METRICS.map(([k, lbl]) => `${lbl.toLowerCase()} ${fmtInt(s[k] || 0)}`).join(', ');
  const [P, E] = state.categories, nP = ideas.filter(i => i.catId === P.id).length;
  L.push(`Отчёт по опубликованным роликам · ${periodTxt} · ${d.getDate()} ${MONTHS_SHORT[d.getMonth()]} ${d.getFullYear()}`);
  L.push(`Опубликовано: ${a.n} (${P.name.toLowerCase()} ${nP}, ${E.name.toLowerCase()} ${a.n - nP}). Статистика заполнена у ${a.withStats}. Сторис не учитываются.`);
  L.push(`Сумма: ${metricsLine(a)} · ER ${fmtPct(a.er)}`);
  if (a.withStats) { const avg = {}; for (const [k] of METRICS) avg[k] = a[k] / a.withStats; L.push(`В среднем на ролик: ${metricsLine(avg)}`); }
  L.push('', 'По подтемам:');
  for (const c of state.categories) for (const sb of c.subtopics) {
    if (isStories(sb)) continue;
    const xs = ideas.filter(i => i.catId === c.id && i.subId === sb.id); if (!xs.length) continue;
    const s = aggStats(xs);
    L.push(`- ${c.name} › ${sb.name}: ${pVideos(s.n)} · ${metricsLine(s)} · ER ${fmtPct(s.er)}`);
  }
  const rk = rating && rating.byId || {};
  if (rating && rating.rows.length) L.push('', `Рейтинг (индекс 0–100 — доля от лучшего по осям: ${rating.axes.map(x => x.lbl).join(', ')}):`,
    ...rating.rows.map(r => `${r.rank}. ${r.score}/100 · «${r.i.title.replace(/\s+/g, ' ').slice(0, 80)}»`));
  L.push('', 'Ролики (от новых к старым):');
  ideas.forEach((i, n) => {
    const c = cat(i.catId), sb = subOf(i.catId, i.subId), st = i.stats || {}, r = rk[i.id];
    L.push(`${n + 1}. ${new Date(pubAt(i)).toLocaleDateString('ru-RU')} · ${c ? c.name : ''} › ${sb ? sb.name : ''} · «${i.title.replace(/\s+/g, ' ').slice(0, 160)}»` +
      (hasStats(st) ? ` · ${metricsLine(st)} · ER ${fmtPct(erOf(st))}${r ? ` · рейтинг ${r.score}/100 (№${r.rank})` : ''}` : ' · статистики нет'));
  });
  copyText(L.join('\n')).then(ok => toast(ok ? 'Отчёт скопирован — вставь его в чат с Claude' : 'Не удалось скопировать'));
}
async function copyText(t) {
  try { await navigator.clipboard.writeText(t); return true; } catch (e) {}
  try { const ta = h('textarea', { value: t, style: 'position:fixed;opacity:0' }); document.body.append(ta); ta.select(); const ok = document.execCommand('copy'); ta.remove(); return ok; } catch (e) { return false; }
}
function removeIdea(i, li) {
  const idx = state.ideas.indexOf(i);
  if (li) li.classList.add('removing');
  setTimeout(() => { const k = state.ideas.indexOf(i); if (k >= 0) { state.ideas.splice(k, 1); tombstone(i.id); commit(); } }, li ? 260 : 0);
  toast('Идея удалена', { action: 'Отменить', onAction: () => { delete state.tombstones[i.id]; i.updatedAt = Date.now(); if (!state.ideas.includes(i)) state.ideas.splice(Math.min(idx, state.ideas.length), 0, i); commit(); } });
}

/* ===================================================================
   Окно добавления (с главного экрана / из категории)
   =================================================================== */
let sheetOpen = false, sheetClose = null;
function openSheet(build, e) {
  if (sheetOpen) return; sheetOpen = true;
  Nav.openSheet();
  const ov = h('div.overlay');
  const sheet = h('div.sheet');
  if (e && e.clientX) { sheet.style.setProperty('--ox', (e.clientX - (window.innerWidth - Math.min(520, window.innerWidth - 32)) / 2) + 'px'); sheet.style.setProperty('--oy', (e.clientY - window.innerHeight * .2) + 'px'); }
  const close = (viaHistory) => {
    if (!sheetOpen) return; sheetOpen = false; sheetClose = null;
    ov.classList.add('closing'); setTimeout(() => ov.remove(), 230); document.removeEventListener('keydown', esc);
    if (viaHistory !== true) Nav.closeSheet();
  };
  sheetClose = close;
  const esc = ev => { if (ev.key === 'Escape') close(); };
  document.addEventListener('keydown', esc);
  ov.addEventListener('mousedown', ev => { if (ev.target === ov) close(); });
  build(sheet, close);
  ov.append(sheet); document.body.append(ov);
  return close;
}
/* lockSub — окно открыто изнутри подтемы: она уже известна, выбор не показываем */
function openAddSheet(catId, presetSub, e, { lockSub = false } = {}) {
  const c = cat(catId);
  openSheet((sheet, close) => {
    sheet.style.setProperty('--accent', c.color);
    let selected = presetSub || (c.subtopics.length === 1 ? c.subtopics[0].id : null);
    const locked = lockSub && subOf(catId, presetSub);
    const chips = h('div.chips'), err = h('div.err');
    const ta = autosize(h('textarea', { placeholder: locked ? 'Хук, идея или целый сценарий — длина не ограничена' : 'Хук или идея ролика. Например: «Проверь на себе: встань на одну ногу на 5 секунд»' }));
    const note = h('input.note', { placeholder: isPhone() ? 'Заметка (необязательно)' : 'Заметка (необязательно): формат, где снимать, что показать' });
    function drawChips() {
      chips.innerHTML = '';
      for (const sb of c.subtopics) {
        const n = ideasIn(catId, sb.id).length;
        chips.append(h('button.chip', { type: 'button', class: selected === sb.id ? 'on' : '', title: sb.hint || '', onclick: () => { selected = sb.id; err.textContent = ''; drawChips(); ta.focus(); } }, sb.name, n ? h('span.n', {}, n) : null));
      }
      const newChip = h('button.chip.new', { type: 'button' }, '+ подтема');
      newChip.onclick = () => {
        const inp = h('input.chip-input', { placeholder: 'Название подтемы' });
        newChip.replaceWith(inp); inp.focus();
        let fired = false;
        const fin = () => { if (fired) return; fired = true; const v = inp.value.trim(); if (v) { const sb = { id: uid(), name: v, shade: nextShade(c), updatedAt: Date.now() }; c.subtopics.push(sb); selected = sb.id; persist(); currentView && currentView.update(); } drawChips(); if (v) ta.focus(); };
        inp.addEventListener('keydown', ev => { if (ev.key === 'Enter') { ev.preventDefault(); fin(); } if (ev.key === 'Escape') { inp.value = ''; fin(); } });
        inp.addEventListener('blur', fin);
      };
      chips.append(newChip);
    }
    drawChips();
    const submit = () => {
      const v = ta.value.trim();
      if (!selected) { err.textContent = 'Выбери подтему — в какую «матрёшку» положить идею.'; return; }
      if (!v) { err.textContent = 'Напиши саму идею.'; ta.focus(); return; }
      addIdea(catId, selected, v, note.value.trim());
      const sb = subOf(catId, selected);
      close();
      toast(`Добавлено: ${c.name} › ${sb.name}`, { action: 'Открыть', onAction: () => go({ level: 'sub', catId, subId: selected }, { dir: 'in' }) });
    };
    ta.addEventListener('keydown', ev => { if ((ev.ctrlKey || ev.metaKey) && ev.key === 'Enter') submit(); });
    sheet.append(h('h3', {}, h('span.sw', { style: `background:${locked ? subColor(c, locked) : c.color}` }), locked ? `Новая идея · ${locked.name}` : `Новая идея · ${c.name}`));
    if (!locked) sheet.append(h('div.lbl', {}, 'Подтема'), chips);
    sheet.append(
      h('div.lbl', {}, locked ? 'Идея или сценарий' : 'Идея'), ta, note, err,
      h('div.foot', {}, h('button.btn.secondary', { onclick: close }, 'Отмена'), h('button.btn', { onclick: submit }, 'Добавить')));
    setTimeout(() => (selected ? ta : chips.querySelector('.chip'))?.focus(), isPhone() ? 350 : 80);
  }, e);
}

/* ===================================================================
   Аккаунт: регистрация и вход (Cloudflare Worker + D1)
   =================================================================== */
const API_BASE = 'https://content-balance-backend.taoo1997.workers.dev';
const AUTH_KEY = 'fuchiji-cb-auth', SYNC_KEY = 'fuchiji-cb-sync';

async function api(method, path, body, { auth = true, keepalive = false } = {}) {
  const opts = { method, headers: {}, keepalive };
  if (body !== undefined) { opts.headers['Content-Type'] = 'application/json'; opts.body = JSON.stringify(body); }
  if (auth) {
    const a = Auth.get();
    if (!a) return { ok: false, status: 401, error: 'Не авторизовано' };
    opts.headers.Authorization = 'Bearer ' + a.token;
  }
  let res;
  try { res = await fetch(API_BASE + path, opts); }
  catch (e) { return { ok: false, status: 0, networkError: true, error: 'Нет связи с сервером' }; }
  let data = null;
  try { data = await res.json(); } catch (e) {}
  if (!res.ok) return { ok: false, status: res.status, error: (data && data.error) || `Ошибка ${res.status}`, data };
  return { ok: true, status: res.status, data };
}

const Auth = {
  _a: undefined,
  get() {
    if (this._a === undefined) { try { this._a = JSON.parse(localStorage.getItem(AUTH_KEY)) || null; } catch (e) { this._a = null; } }
    return this._a;
  },
  user() { const a = this.get(); return a ? a.user : null; },
  set(a) { this._a = a; try { a ? localStorage.setItem(AUTH_KEY, JSON.stringify(a)) : localStorage.removeItem(AUTH_KEY); } catch (e) {} },
  async register(name, login, password) {
    const r = await api('POST', '/api/register', { name, login, password }, { auth: false });
    if (r.ok) this.set({ token: r.data.token, user: r.data.user });
    return r;
  },
  async login(login, password) {
    const r = await api('POST', '/api/login', { login, password }, { auth: false });
    if (r.ok) this.set({ token: r.data.token, user: r.data.user });
    return r;
  },
  async logout() {
    if (Sync.dirty) {
      Sync.setStatus('saving');
      const r = await Sync.push();
      if (!r) { toast('Не удалось отправить последние изменения — выйти можно, когда появится связь'); return; }
    }
    api('POST', '/api/logout', {}).catch(() => {});
    this.set(null);
    // локальная копия принадлежит аккаунту — на устройстве не оставляем
    state = defaultState(); save(); Sync.reset();
    document.body.querySelectorAll('.overlay').forEach(o => o.remove()); sheetOpen = false; sheetClose = null;
    showAuthScreen();
  },
  /* сессия отозвана или протухла: выходим, но локальные данные оставляем — они уйдут на сервер после входа */
  expired() { this.set(null); Sync.reset(); showAuthScreen('Сессия закончилась — войди ещё раз'); }
};

/* экран входа / регистрации */
let authEl = null;
function showAuthScreen(message) {
  document.querySelector('.app').classList.add('locked');
  if (authEl) authEl.remove();
  let mode = 'login', busy = false;
  const err = h('div.err', {}, message || '');
  const name = h('input', { placeholder: 'Как тебя зовут', autocomplete: 'name', maxlength: 80 });
  const login = h('input', { placeholder: 'email или телефон', autocomplete: 'username', inputmode: 'email' });
  const pass = h('input', { type: 'password', placeholder: 'минимум 6 символов', autocomplete: 'current-password' });
  const eye = h('button', { type: 'button', onclick: () => { pass.type = pass.type === 'password' ? 'text' : 'password'; eye.textContent = pass.type === 'password' ? 'показать' : 'скрыть'; } }, 'показать');
  const nameLbl = h('label', {}, 'Имя', name);
  const submit = h('button.btn', { type: 'submit' }, 'Войти');
  const tabs = h('div.auth-tabs');
  const form = h('form.auth-form', { onsubmit: async e => {
    e.preventDefault(); if (busy) return;
    err.textContent = '';
    const l = login.value.trim(), p = pass.value;
    if (!l) { err.textContent = 'Введи email или телефон'; login.focus(); return; }
    if (mode === 'register' && !name.value.trim()) { err.textContent = 'Введи имя'; name.focus(); return; }
    if (p.length < 6) { err.textContent = 'Пароль — минимум 6 символов'; pass.focus(); return; }
    busy = true; submit.disabled = true; submit.textContent = mode === 'login' ? 'Входим…' : 'Создаём…';
    const r = mode === 'login' ? await Auth.login(l, p) : await Auth.register(name.value.trim(), l, p);
    busy = false; submit.disabled = false; setMode(mode);
    if (!r.ok) { err.textContent = r.error; return; }
    enterApp(true);
  } }, nameLbl, h('label', {}, 'Логин', login), h('label', {}, 'Пароль', h('div.pw', {}, pass, eye)), err, submit);
  function setMode(m) {
    mode = m;
    tabs.innerHTML = '';
    tabs.append(h('button', { type: 'button', class: m === 'login' ? 'on' : '', onclick: () => setMode('login') }, 'Войти'),
      h('button', { type: 'button', class: m === 'register' ? 'on' : '', onclick: () => setMode('register') }, 'Создать аккаунт'));
    nameLbl.style.display = m === 'register' ? '' : 'none';
    pass.autocomplete = m === 'register' ? 'new-password' : 'current-password';
    submit.textContent = m === 'login' ? 'Войти' : 'Создать аккаунт';
  }
  setMode('login');
  authEl = h('div.auth', {}, h('div.auth-card', {},
    h('div.brand', {}, h('div.logo'), h('div', {}, h('h1', {}, 'Баланс контента'), h('small', {}, 'fuchiji.dance · личное ↔ экспертное'))),
    tabs, form,
    h('p.note', {}, 'Идеи и планы хранятся в аккаунте и одинаковы на всех устройствах, где ты вошёл.')));
  document.body.append(authEl);
  setTimeout(() => login.focus(), 80);
}
function enterApp(justLoggedIn) {
  if (authEl) { authEl.remove(); authEl = null; }
  document.querySelector('.app').classList.remove('locked');
  if (!currentView) go({ level: 'home' }); else rerender();
  Sync.start(justLoggedIn);
}

/* ===================================================================
   Синхронизация между устройствами
   -------------------------------------------------------------------
   На сервере лежит один JSON со всеми данными и метка версии updatedAt.
   Клиент помнит base — версию сервера, от которой отсчитаны его правки.
   PUT с устаревшим base сервер отклоняет (409) и отдаёт свою версию —
   тогда клиент сливает обе (по идеям и подтемам, с учётом удалений)
   и отправляет результат. Так правки с двух устройств не затирают друг друга.
   =================================================================== */
const Sync = {
  base: 0, dirty: false, pushing: null, timer: null, pollTimer: null, status: 'idle', rerenderPending: false,
  load() { try { const s = JSON.parse(localStorage.getItem(SYNC_KEY)); if (s) { this.base = s.base || 0; this.dirty = !!s.dirty; } } catch (e) {} },
  saveMeta() { try { localStorage.setItem(SYNC_KEY, JSON.stringify({ base: this.base, dirty: this.dirty })); } catch (e) {} },
  reset() { this.base = 0; this.dirty = false; clearTimeout(this.timer); clearInterval(this.pollTimer); this.pollTimer = null; this.saveMeta(); this.setStatus('idle'); },
  setStatus(s, text) {
    this.status = s;
    const pill = document.getElementById('syncPill');
    pill.className = 'sync ' + s;
    pill.querySelector('span').textContent = text || { idle: '…', ok: 'синхронизировано', saving: 'сохраняю…', offline: 'офлайн · сохранено на устройстве', error: 'ошибка синхронизации' }[s];
  },
  start(justLoggedIn) {
    this.load();
    if (justLoggedIn) this.firstSync(); else this.pull();
    if (!this.pollTimer) this.pollTimer = setInterval(() => { if (document.visibilityState === 'visible' && navigator.onLine) this.pull(); }, 45000);
  },
  /* сразу после входа: на устройстве могли быть идеи без аккаунта — не теряем их */
  async firstSync() {
    this.setStatus('saving');
    const r = await api('GET', '/api/data');
    const localHas = state.ideas.length > 0 || Object.keys(state.plans).length > 0;
    if (r.ok) {
      const merged = localHas ? mergeStates(state, r.data.state) : normalizeState(r.data.state);
      const changed = localHas;
      state = merged; this.base = r.data.updatedAt; this.dirty = changed; save(); this.saveMeta();
      this.requestRerender();
      if (changed) await this.push(); else this.setStatus('ok');
      if (localHas) toast('Идеи с этого устройства объединены с аккаунтом');
    } else if (r.status === 404) { this.dirty = true; this.saveMeta(); await this.push(); }
    else this.fail(r);
  },
  schedulePush() {
    if (!Auth.get()) return;
    this.dirty = true; this.saveMeta(); this.setStatus('saving');
    clearTimeout(this.timer);
    this.timer = setTimeout(() => this.push(), 900);
  },
  async push(opts = {}) {
    if (!Auth.get()) return false;
    if (this.pushing) { await this.pushing; if (!this.dirty) return true; }
    clearTimeout(this.timer);
    this.pushing = this._push(opts);
    try { return await this.pushing; } finally { this.pushing = null; }
  },
  async _push({ keepalive = false, retried = false } = {}) {
    this.setStatus('saving');
    const sentAt = state.updatedAt;
    const r = await api('PUT', '/api/data', { updatedAt: state.updatedAt, baseUpdatedAt: this.base, state }, { keepalive });
    if (r.ok) {
      this.base = r.data.updatedAt;
      if (state.updatedAt === sentAt) this.dirty = false;   // пока летело — могли поправить ещё
      this.saveMeta(); this.setStatus('ok');
      if (this.dirty) return this._push();
      return true;
    }
    if (r.status === 409 && r.data && r.data.state && !retried) {
      // на сервере уже другая версия — сливаем и отправляем результат
      state = mergeStates(state, r.data.state); this.base = r.data.updatedAt; save(); this.saveMeta();
      this.requestRerender();
      return this._push({ retried: true });
    }
    return this.fail(r);
  },
  async pull() {
    if (!Auth.get() || this.pushing) return;
    const r = await api('GET', '/api/data');
    if (r.ok) {
      if (r.data.updatedAt === this.base) { if (this.dirty) this.push(); else this.setStatus('ok'); return; }
      if (this.dirty) { state = mergeStates(state, r.data.state); this.base = r.data.updatedAt; save(); this.saveMeta(); this.requestRerender(); this.push(); return; }
      state = normalizeState(r.data.state) || state; this.base = r.data.updatedAt; save(); this.saveMeta();
      this.requestRerender(); this.setStatus('ok');
    } else if (r.status === 404) { if (state.ideas.length || this.dirty) { this.dirty = true; this.push(); } else this.setStatus('ok'); }
    else this.fail(r);
  },
  fail(r) {
    if (r.status === 401) { Auth.expired(); return false; }
    if (r.networkError) this.setStatus('offline'); else { this.setStatus('error'); toast(r.error || 'Ошибка синхронизации'); }
    return false;
  },
  async syncNow() { this.setStatus('saving'); if (this.dirty) await this.push(); await this.pull(); if (this.status === 'ok') toast('Синхронизировано'); },
  /* не дёргаем экран, пока человек печатает — перестроим, когда уйдёт фокус */
  requestRerender() {
    const a = document.activeElement, typing = a && (a.tagName === 'INPUT' || a.tagName === 'TEXTAREA') && a.closest('#stage, .overlay');
    if (!typing) { rerender(); return; }
    if (this.rerenderPending) return;
    this.rerenderPending = true;
    const done = () => { this.rerenderPending = false; if (!sheetOpen) rerender(); };
    a.addEventListener('blur', done, { once: true });
    setTimeout(() => { if (this.rerenderPending) done(); }, 30000);
  }
};

/* слияние двух версий: по идеям и подтемам берём более свежую запись, удаления учитываем через tombstones */
function mergeStates(a, b) {
  a = normalizeState(a) || defaultState(); b = normalizeState(b) || defaultState();
  const newer = (a.updatedAt || 0) >= (b.updatedAt || 0) ? a : b, older = newer === a ? b : a;
  const tomb = { ...older.tombstones };
  for (const [k, v] of Object.entries(newer.tombstones)) tomb[k] = Math.max(v, tomb[k] || 0);
  const ts = x => x.updatedAt || x.doneAt || x.createdAt || 0;
  const ideas = new Map();
  for (const i of [...older.ideas, ...newer.ideas]) { const cur = ideas.get(i.id); if (!cur || ts(i) >= ts(cur)) ideas.set(i.id, i); }
  const alive = [...ideas.values()].filter(i => !(tomb[i.id] > ts(i))).sort((x, y) => (x.createdAt || 0) - (y.createdAt || 0));
  const categories = newer.categories.map(c => {
    const oc = older.categories.find(x => x.id === c.id);
    const subs = c.subtopics.map(sb => { const o = oc && oc.subtopics.find(x => x.id === sb.id); return o && (o.updatedAt || 0) > (sb.updatedAt || 0) ? o : sb; });
    if (oc) for (const sb of oc.subtopics) if (!subs.find(x => x.id === sb.id)) subs.push(sb);
    const used = new Set(alive.filter(i => i.catId === c.id).map(i => i.subId));
    return { ...c, subtopics: subs.filter(sb => used.has(sb.id) || !(tomb[sb.id] > (sb.updatedAt || 0))) };
  });
  for (const c of older.categories) if (!categories.find(x => x.id === c.id)) categories.push(c);
  return { version: 5, categories, ideas: alive, plans: { ...older.plans, ...newer.plans }, lastPlan: newer.lastPlan ?? older.lastPlan ?? 8, tombstones: tomb, updatedAt: Date.now() };
}

/* ===================================================================
   Установка как приложения (PWA)
   =================================================================== */
const Install = {
  deferred: null,
  available() { return !!this.deferred && !this.standalone(); },
  standalone() { return matchMedia('(display-mode: standalone)').matches || navigator.standalone === true; },
  iosHint() { return /iphone|ipad|ipod/i.test(navigator.userAgent) && !this.standalone(); },
  async prompt() { if (!this.deferred) return; this.deferred.prompt(); const { outcome } = await this.deferred.userChoice; if (outcome === 'accepted') { this.deferred = null; toast('Приложение установлено'); } },
  showIosHint() {
    openSheet((sheet, close) => {
      sheet.append(h('h3', {}, 'Установить на iPhone'),
        h('p.txt', {}, '1. Открой эту страницу в Safari.', h('br'), '2. Нажми «Поделиться» (квадрат со стрелкой вверх).', h('br'), '3. Выбери «На экран „Домой“» → «Добавить».', h('br'), h('br'), 'Появится иконка, приложение откроется без адресной строки.'),
        h('div.foot', {}, h('button.btn', { onclick: close }, 'Понятно')));
    });
  }
};
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); Install.deferred = e; });
window.addEventListener('appinstalled', () => { Install.deferred = null; });
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  navigator.serviceWorker.register('./sw.js').catch(() => {});
}

/* ===================================================================
   Старт
   =================================================================== */
document.getElementById('syncPill').addEventListener('click', () => { if (Auth.get()) Sync.syncNow(); });
window.addEventListener('online', () => Auth.get() && Sync.syncNow());
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && Auth.get()) Sync.pull(); });
window.addEventListener('focus', () => Auth.get() && Sync.pull());
// при уходе со страницы досылаем несохранённое, не дожидаясь таймера
window.addEventListener('pagehide', () => { if (Auth.get() && Sync.dirty && !Sync.pushing) Sync.push({ keepalive: true }); });
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden' && Auth.get() && Sync.dirty && !Sync.pushing) Sync.push({ keepalive: true }); });

Nav.init();
if (Auth.get()) enterApp(false); else showAuthScreen();
</script>
</body>
</html>
