<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
<title>Баланс контента · fuchiji.dance</title>
<meta name="theme-color" content="#0e1015">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Баланс">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0e1015; --surface:#161a22; --surface-2:#1d222c; --surface-3:#252b37;
  --line:#2a303c; --line-2:#343b49;
  --ink:#eef0f4; --ink-2:#aab1bf; --ink-3:#6f7889;
  --personal:#E85D45; --expert:#3F86E6;
  --good:#3fb47a; --warn:#e2a93b;
  --radius:18px; --radius-s:12px;
  --shadow:0 18px 50px rgba(0,0,0,.45);
  --font:"Manrope",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root{
    --bg:#f4f5f8; --surface:#ffffff; --surface-2:#f2f4f8; --surface-3:#e8ebf1;
    --line:#e3e6ec; --line-2:#d3d8e1;
    --ink:#161a22; --ink-2:#4b5363; --ink-3:#8a92a3;
    --shadow:0 18px 50px rgba(20,30,60,.14);
    color-scheme:light;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
/* touch-action: manipulation — убирает зум по двойному тапу (из-за него на телефоне
   «уезжал» масштаб при переходе в категорию), прокрутка и pinch остаются */
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;touch-action:manipulation;overflow-x:hidden}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0;touch-action:manipulation}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--expert);outline-offset:2px;border-radius:8px}
/* на тач-экранах нажатие — это «вдавливание» элемента, а не синяя рамка */
@media (hover:none){
  .pressable:active,.btn:active,.add-btn:active,.back:active,.ghost-btn:active,.icon-btn:active,.chip:active,.filters button:active,.sub-row:active,.an-row:active,.an-seq .step:active,.stepper button:active,.crumbs button:active,.idea .acts button:active,.st-btn:active,.st-link:active,.top-row:active,.pub-btn:active,.dropdown button:active{transform:scale(.96);transition-duration:.08s}
  .add-btn:hover,.btn:hover{filter:none}
  .add-btn:hover{transform:none}
  .add-btn:active{transform:scale(.96)}
}
::selection{background:rgba(63,134,230,.35)}
/* полосы прокрутки — тонкие, в стиле приложения, не доходят до скруглённых углов */
*{scrollbar-width:thin;scrollbar-color:var(--line-2) transparent}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent;margin:10px 0}
::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:var(--ink-3)}
::-webkit-scrollbar-corner{background:transparent}

.app{max-width:1560px;margin:0 auto;padding:20px 28px 28px}
@media (max-width:860px){.app{padding:16px 16px 40px}}

/* ---------- header ---------- */
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.brand .logo{width:38px;height:38px;border-radius:12px;background:conic-gradient(from -90deg,var(--personal) 0 50%,var(--expert) 50% 100%);position:relative;flex:none}
.brand .logo::after{content:"";position:absolute;inset:11px;border-radius:50%;background:var(--bg)}
.brand h1{font-size:18px;margin:0;font-weight:800;letter-spacing:-.01em}
.brand small{display:block;color:var(--ink-3);font-weight:500;font-size:12px}
.crumbs{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--ink-3);flex-wrap:wrap}
.crumbs button{color:var(--ink-2);padding:6px 10px;border-radius:9px;font-weight:600;transition:background .2s,color .2s}
.crumbs button:hover{background:var(--surface-2);color:var(--ink)}
.crumbs .cur{color:var(--ink);font-weight:700;padding:6px 10px}
.crumbs .sep{opacity:.6}
.menu-wrap{position:relative}
.icon-btn{width:38px;height:38px;border-radius:11px;display:inline-grid;place-items:center;background:var(--surface);border:1px solid var(--line);color:var(--ink-2);transition:background .2s,color .2s,transform .15s}
.icon-btn:hover{background:var(--surface-2);color:var(--ink)}
.icon-btn:active{transform:scale(.94)}
.dropdown{position:absolute;right:0;top:46px;min-width:250px;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:6px;z-index:40;transform-origin:top right;animation:pop .22s cubic-bezier(.2,.8,.2,1) both}
.dropdown button{display:flex;width:100%;text-align:left;padding:10px 12px;border-radius:9px;gap:10px;align-items:center;color:var(--ink);font-weight:500}
.dropdown button:hover{background:var(--surface-2)}
.dropdown button.danger{color:var(--personal)}
.dropdown hr{border:0;border-top:1px solid var(--line);margin:6px 4px}
.dropdown small{display:block;color:var(--ink-3);font-weight:400;font-size:12px}
@media (max-width:700px){.top{gap:10px}.crumbs{order:3;flex-basis:100%;margin-top:-4px}.menu-wrap{margin-left:auto}}

/* ---------- stage & zoom ---------- */
/* по горизонтали режем (иначе зум-анимация даёт боковую прокрутку), по вертикали — нет, чтобы уходящий экран не обрезался */
.stage{position:relative;--ox:50%;--oy:50%;overflow:clip visible}
.view{transform-origin:var(--ox) var(--oy)}
.view.enter-in,.view.enter-out,.view.leaving{will-change:transform,opacity}
.view.leaving{position:absolute;inset:0;pointer-events:none;z-index:2}
@keyframes zoomIntoNew{from{opacity:0;transform:scale(.5)}to{opacity:1;transform:none}}
@keyframes zoomAwayOld{to{opacity:0;transform:scale(2.4)}}
@keyframes zoomBackNew{from{opacity:0;transform:scale(1.7)}to{opacity:1;transform:none}}
@keyframes zoomBackOld{to{opacity:0;transform:scale(.45)}}
.view.enter-in{animation:zoomIntoNew .6s cubic-bezier(.16,.84,.24,1) both}
.view.leave-in{animation:zoomAwayOld .55s cubic-bezier(.4,0,.8,.4) both}
.view.enter-out{animation:zoomBackNew .55s cubic-bezier(.16,.84,.24,1) both}
.view.leave-out{animation:zoomBackOld .5s cubic-bezier(.4,0,.8,.4) both}
@media (prefers-reduced-motion:reduce){.view{animation-duration:.01s!important}}

/* ---------- layout ---------- */
.grid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(300px,.85fr);gap:22px;align-items:start}
/* minmax(0,1fr): иначе на телефоне колонка растягивалась под самый широкий элемент и экран уезжал вбок */
@media (max-width:860px){.grid{grid-template-columns:minmax(0,1fr)}}
/* главный экран и экран категории — во всю высоту окна, кольцо одного размера на обоих */
:is(.home,.cat) .grid{grid-template-columns:minmax(0,1.6fr) minmax(320px,.8fr);align-items:stretch}
.home .side{display:flex;flex-direction:column;gap:16px}
.home .side .card{flex:1;display:flex;flex-direction:column;justify-content:center;margin:0}
:is(.home,.cat) .donut-wrap{width:min(100%,calc(100vh - 330px),720px);min-width:min(100%,280px)}
@media (min-width:861px){
  :is(.home,.cat) .chart-card{min-height:calc(100vh - 122px);justify-content:center;gap:24px;padding:30px 30px 24px}
  .cat .chart-card{min-height:calc(100vh - 190px)}
  :is(.home,.cat) .add-row{max-width:760px}
  :is(.home,.cat) .center .big{font-size:52px}
  :is(.home,.cat) .center .sub{font-size:14px;margin-top:8px}
  .home .ring{width:120px;height:120px}
  .home .ring .val{font-size:30px}
  .home .ring .val small{font-size:12px}
  .home .plan-info .line1{font-size:20px}
  .home .plan-info .line2{font-size:14px}
  .home .bal-nums .big{font-size:38px}
  .home .legend,.home .tip{font-size:14px}
  .home .card h3{font-size:13px}
  :is(.home,.cat) .add-btn{padding:16px 20px;font-size:16px}
}
@media (max-width:860px){:is(.home,.cat) .grid{grid-template-columns:minmax(0,1fr)}.home .side .card{flex:none}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;min-width:0}
.card + .card{margin-top:14px}
.card h3{margin:0 0 4px;font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);font-weight:700}
.chart-card{padding:26px 22px 22px;display:flex;flex-direction:column;align-items:center;gap:14px;position:relative;overflow:hidden}
.chart-card .glow{position:absolute;width:640px;height:640px;border-radius:50%;opacity:.14;pointer-events:none;transition:opacity .6s}
.chart-card .glow.p{background:radial-gradient(closest-side,var(--personal),transparent);left:-220px;top:-200px}
.chart-card .glow.e{background:radial-gradient(closest-side,var(--expert),transparent);right:-220px;bottom:-220px}
.donut-wrap{position:relative;width:min(100%,400px);aspect-ratio:1}
.donut{width:100%;height:100%;display:block;overflow:visible}
.donut .seg{transition:transform .28s cubic-bezier(.2,.8,.2,1),opacity .3s;transform-box:view-box;transform-origin:center;cursor:pointer;outline:none}
.donut .seg.hover{transform:translate(var(--dx),var(--dy))}
.donut .seg.dim{opacity:.55}
/* нажатие на сегмент: он слегка «вдавливается» к центру кольца, при отпускании — пружинит обратно */
.donut .seg.pressed{transform:scale(.94);transition:transform .1s ease-out,opacity .3s}
.donut .seg.released{transition:transform .45s cubic-bezier(.34,1.56,.64,1),opacity .3s}
@media (hover:none){.donut .seg.hover{transform:none}.donut .seg.dim{opacity:1}.donut .seg.empty.dim{opacity:.3}}
/* пустой сегмент — «слот» направления: бледный, но живой и кликабельный */
.donut .seg.empty{opacity:.3}
.donut .seg.empty.dim{opacity:.2}
.donut .seg.empty.hover{opacity:.55}
.donut .lab{pointer-events:none;fill:#fff;text-anchor:middle;font-family:var(--font)}
.donut .lab .n{font-size:13px;font-weight:600;opacity:.92}
.donut .lab .p{font-size:24px;font-weight:800;letter-spacing:-.02em;line-height:1}
.donut .lab .c{font-size:11px;font-weight:500;opacity:.85}
/* формат съёмки — в скобках сразу под названием сегмента */
.donut .lab .f{font-size:10.5px;font-weight:600;opacity:.8;letter-spacing:.01em}
/* пустой сегмент: название — крупно и читаемо, «пусто» — мелкой подписью под ним */
.donut .lab.empty{fill:var(--ink)}
.donut .lab.empty .n{font-size:14px;font-weight:700;opacity:.9;letter-spacing:-.01em}
.donut .lab.empty .f{opacity:.65}
.donut .lab.empty .p{font-size:11px;font-weight:600;opacity:.55;letter-spacing:.04em;text-transform:uppercase}
.center{position:absolute;inset:0;display:grid;place-items:center;text-align:center;pointer-events:none}
.center .big{font-size:38px;font-weight:800;letter-spacing:-.03em;line-height:1}
.center .sub{color:var(--ink-3);font-size:13px;margin-top:6px;font-weight:600;letter-spacing:0}
.center .sub b{color:var(--ink-2)}
.add-row{display:flex;justify-content:space-between;gap:14px;width:100%;flex-wrap:wrap}
.add-btn{flex:1;min-width:200px;display:flex;align-items:center;justify-content:center;gap:10px;padding:14px 18px;border-radius:14px;font-weight:700;font-size:15px;color:#fff;transition:transform .15s,filter .2s,box-shadow .2s;box-shadow:0 8px 24px -8px currentColor}
.add-btn:hover{filter:brightness(1.08);transform:translateY(-1px)}
.add-btn:active{transform:scale(.97)}
.add-btn .plus{width:24px;height:24px;border-radius:50%;background:rgba(255,255,255,.22);display:grid;place-items:center;font-size:18px;line-height:1}
.add-btn.personal{background:var(--personal)}
.add-btn.expert{background:var(--expert)}
.hint{color:var(--ink-3);font-size:13px;margin:0;text-align:center}
.hint b{color:var(--ink-2);font-weight:600}

/* ---------- plan card ---------- */
.plan-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.plan-body{display:flex;gap:18px;align-items:center;margin-top:10px}
.ring{width:96px;height:96px;flex:none;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:9;stroke-linecap:round}
.ring .track{stroke:var(--surface-3)}
.ring .bar{stroke:var(--good);transition:stroke-dashoffset .8s cubic-bezier(.2,.8,.2,1),stroke .4s}
.ring .val{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;font-size:24px;letter-spacing:-.02em;line-height:1}
.ring .val small{font-size:11px;color:var(--ink-3);font-weight:600;line-height:1;margin-top:4px;letter-spacing:0}
.plan-info{flex:1;min-width:0}
.plan-info .line1{font-size:17px;font-weight:700}
.plan-info .line1 span{color:var(--ink-3);font-weight:600}
.plan-info .line2{color:var(--ink-2);font-size:13px;margin-top:2px}
.plan-info .status{margin-top:8px;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:99px;background:var(--surface-2)}
.status.ok{color:var(--good)}.status.behind{color:var(--warn)}.status.done{color:var(--good)}
.stepper{display:inline-flex;align-items:center;gap:2px;background:var(--surface-2);border-radius:10px;padding:3px}
.stepper button{width:30px;height:30px;border-radius:8px;font-size:18px;font-weight:700;color:var(--ink-2);display:grid;place-items:center;transition:background .15s,color .15s}
.stepper button:hover{background:var(--surface-3);color:var(--ink)}
.stepper .num{min-width:34px;text-align:center;font-weight:800;font-size:16px}
.plan-foot{margin-top:12px;font-size:12px;color:var(--ink-3);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}

/* ---------- done balance ---------- */
.bal-nums{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-top:4px}
.bal-nums .big{font-size:30px;font-weight:800;letter-spacing:-.03em}
.bal-nums .big small{font-size:13px;color:var(--ink-3);font-weight:600;margin-left:6px;letter-spacing:0}
.bar{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--surface-3);margin-top:12px;gap:2px}
.bar i{display:block;height:100%;transition:width .7s cubic-bezier(.2,.8,.2,1)}
.bar i.p{background:var(--personal)}.bar i.e{background:var(--expert)}
.legend{display:flex;justify-content:space-between;gap:10px;margin-top:10px;font-size:13px;flex-wrap:wrap}
.legend .it{display:flex;align-items:center;gap:8px;color:var(--ink-2)}
.legend .dot{width:9px;height:9px;border-radius:50%;flex:none}
.legend b{color:var(--ink);font-weight:700}
.tip{margin-top:12px;padding:10px 12px;border-radius:10px;background:var(--surface-2);font-size:13px;color:var(--ink-2);display:flex;gap:8px;align-items:flex-start}
.tip .ic{flex:none;font-size:15px}
.tip b{color:var(--ink);font-weight:700}

/* ---------- анализ снятого ---------- */
.home .an-card{margin-top:22px;flex:none}
.an-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.an-head h3{margin:0}
.an-head .filters{margin:0}
.an-sum{display:flex;align-items:center;gap:18px;margin-top:14px;flex-wrap:wrap}
.an-sum .big{font-size:34px;font-weight:800;letter-spacing:-.03em;line-height:1}
.an-sum .big small{font-size:13px;color:var(--ink-3);font-weight:600;margin-left:6px;letter-spacing:0}
.an-sum .bar{flex:1;min-width:200px;margin:0}
.an-verdict{margin-top:12px;padding:12px 14px;border-radius:12px;background:var(--surface-2);font-size:14px;color:var(--ink-2);display:flex;gap:10px;align-items:flex-start;line-height:1.4}
.an-verdict .ic{flex:none;font-size:16px}
.an-verdict b{color:var(--ink);font-weight:700}
.an-cols{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:16px}
@media (max-width:760px){.an-cols{grid-template-columns:1fr}}
.an-col{display:flex;flex-direction:column;gap:6px;min-width:0}
.an-col .an-cat{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px;margin-bottom:4px}
.an-col .an-cat .dot{width:10px;height:10px;border-radius:3px}
.an-col .an-cat .cnt{margin-left:auto;color:var(--ink-3);font-weight:600;font-size:13px}
.an-col .an-cat .cnt b{color:var(--ink)}
.an-row{display:grid;grid-template-columns:minmax(0,1fr) 34px;gap:8px 12px;align-items:center;padding:8px 10px;border-radius:10px;background:var(--surface-2);border:1px solid transparent;cursor:pointer;transition:border-color .2s,background .2s}
.an-row:hover{border-color:var(--line-2);background:var(--surface-3)}
.an-row .nm{font-weight:600;font-size:13px;display:flex;align-items:center;gap:8px;min-width:0}
.an-row .nm span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.an-row .tag{font-size:11px;font-weight:700;padding:2px 7px;border-radius:99px;background:var(--surface);color:var(--ink-3);flex:none;letter-spacing:.02em}
.an-row .tag.low{color:var(--warn)}
.an-row .tag.zero{color:var(--personal)}
.an-row .tag.hi{color:var(--good)}
.an-row .n{text-align:right;font-weight:800;font-size:15px}
.an-row .track{grid-column:1/-1;height:6px;border-radius:3px;background:var(--surface);overflow:hidden;position:relative}
.an-row .track i{display:block;height:100%;border-radius:3px;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.an-row .track .avg{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--ink-3);opacity:.9}
.an-next{margin-top:16px}
.an-next h4{margin:0 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);font-weight:700}
.an-seq{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.an-seq .step{display:inline-flex;align-items:center;gap:8px;padding:8px 12px 8px 8px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line);font-size:13px;font-weight:600;color:var(--ink);transition:border-color .2s,transform .15s;cursor:pointer}
.an-seq .step:hover{border-color:var(--line-2);transform:translateY(-1px)}
.an-seq .step .num{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;color:#fff;font-size:12px;font-weight:800;flex:none}
.an-seq .step small{color:var(--ink-3);font-weight:600}
.an-seq .arr{color:var(--ink-3);font-size:14px}
.an-foot{margin-top:12px;font-size:12px;color:var(--ink-3)}

/* ---------- inner views ---------- */
.view-head{display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.back{display:inline-flex;align-items:center;gap:6px;padding:8px 12px 8px 8px;border-radius:10px;background:var(--surface);border:1px solid var(--line);color:var(--ink-2);font-weight:600;font-size:13px;transition:background .2s,color .2s,transform .15s}
.back:hover{background:var(--surface-2);color:var(--ink)}
.back:active{transform:scale(.96)}
.view-head h2{margin:0;font-size:26px;font-weight:800;letter-spacing:-.02em;display:flex;align-items:center;gap:10px;min-width:0}
.view-head h2 .sw{width:14px;height:14px;border-radius:5px;flex:none}
.view-head h2 .fmt{font-size:16px;font-weight:600;color:var(--ink-3);letter-spacing:0;white-space:nowrap}
.view-head h2 .fmt:empty{display:none}
.view-head .meta{color:var(--ink-3);font-size:14px;font-weight:600}
.view-head .spacer{flex:1}
.ghost-btn{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:10px;border:1px dashed var(--line-2);color:var(--ink-2);font-weight:600;font-size:13px;transition:background .2s,color .2s,border-color .2s}
.ghost-btn:hover{background:var(--surface-2);color:var(--ink);border-color:var(--ink-3)}
.ghost-btn.danger:hover{color:var(--personal);border-color:var(--personal)}

.sub-list{display:flex;flex-direction:column;gap:6px}
.sub-row{display:flex;align-items:center;gap:12px;padding:12px 12px;border-radius:12px;background:var(--surface-2);border:1px solid transparent;transition:border-color .2s,transform .15s,background .2s;cursor:pointer}
.sub-row:hover{border-color:var(--line-2);background:var(--surface-3)}
.sub-row:active{transform:scale(.99)}
.sub-row .dot{width:12px;height:12px;border-radius:4px;flex:none}
.sub-row .name{flex:1;font-weight:700;min-width:0;line-height:1.25}
.sub-row .name small{display:block;font-weight:500;font-size:12px;color:var(--ink-3)}
.sub-row .cnt{color:var(--ink-3);font-size:13px;font-weight:600;white-space:nowrap}
.sub-row .cnt b{color:var(--ink-2)}
.sub-row .mini{display:flex;gap:2px;height:6px;width:56px;border-radius:3px;overflow:hidden;background:var(--surface);flex:none}
.sub-row .mini i{display:block;height:100%}
.sub-row .plus{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;color:var(--ink-2);background:var(--surface);font-size:18px;font-weight:700;transition:background .15s,color .15s,transform .15s;flex:none}
.sub-row .plus:hover{color:#fff;transform:scale(1.06)}
.sub-row .arrow{color:var(--ink-3);flex:none}
.empty{text-align:center;color:var(--ink-3);padding:26px 10px;font-size:14px}
.empty b{color:var(--ink-2)}

/* ---------- idea list ---------- */
.add-form{display:flex;gap:10px;margin-bottom:14px}
.add-form input{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:13px 14px;font-size:15px;transition:border-color .2s}
.add-form input::placeholder{color:var(--ink-3)}
.add-form input:focus{border-color:var(--accent,var(--expert));outline:none}
/* на телефоне однострочное поле бесполезно для сценария — остаётся только широкая кнопка,
   она открывает окно с большим полем ввода */
@media (max-width:700px){
  .add-form input{display:none}
  .add-form .btn{flex:1;padding:15px 18px;font-size:16px;border-radius:14px;box-shadow:0 8px 24px -8px currentColor}
}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 18px;border-radius:12px;font-weight:700;background:var(--accent,var(--expert));color:#fff;transition:filter .2s,transform .15s;white-space:nowrap}
.btn:hover{filter:brightness(1.08)}.btn:active{transform:scale(.97)}
.btn.secondary{background:var(--surface-2);color:var(--ink-2)}
.btn.secondary:hover{color:var(--ink);filter:none;background:var(--surface-3)}
.btn:disabled{opacity:.5;cursor:not-allowed;filter:none;transform:none}
.filters{display:flex;gap:4px;margin-bottom:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px;width:max-content;max-width:100%}
.filters button{padding:7px 12px;border-radius:9px;font-size:13px;font-weight:600;color:var(--ink-3);transition:background .2s,color .2s}
.filters button.on{background:var(--surface-3);color:var(--ink)}
.filters button:hover:not(.on){color:var(--ink-2)}
.ideas{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.idea{display:flex;flex-direction:column;gap:10px;padding:14px 14px 12px;border-radius:14px;background:var(--surface);border:1px solid var(--line);transition:border-color .2s,transform .3s,opacity .3s;animation:rowIn .35s cubic-bezier(.2,.8,.2,1) both}
@keyframes rowIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.idea:hover{border-color:var(--line-2)}
.idea.removing{opacity:0;transform:translateX(30px) scale(.98)}
.idea .main{display:flex;gap:12px;align-items:flex-start}
.idea .body{flex:1;min-width:0}
.idea .place{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--ink-3);margin-bottom:6px}
.idea .place .dot{width:8px;height:8px;border-radius:3px;flex:none}
.idea .title{font-weight:600;font-size:15px;line-height:1.4;word-wrap:break-word;white-space:pre-wrap}
.idea .note{color:var(--ink-2);font-size:13px;margin-top:4px;white-space:pre-wrap}
/* низ карточки: кнопка перевода в следующий статус (в очереди → снято → опубликовано),
   у опубликованных — чипы со статистикой, справа — даты */
.idea-foot{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding-top:10px;border-top:1px solid var(--line)}
.idea-foot .meta{color:var(--ink-3);font-size:12px;margin-left:auto;display:flex;gap:10px;flex-wrap:wrap}
.idea-foot .meta .done-tag{color:var(--good);font-weight:600}
.st-btn{display:inline-flex;align-items:center;gap:7px;padding:9px 14px;border-radius:10px;font-weight:700;font-size:13px;background:var(--accent,var(--expert));color:#fff;transition:filter .2s,transform .15s;white-space:nowrap}
.st-btn:hover{filter:brightness(1.08)}.st-btn:active{transform:scale(.97)}
.st-btn svg{width:15px;height:15px}
.st-btn.pub{background:var(--good)}
.st-btn.secondary{background:var(--surface-2);color:var(--ink-2)}
.st-btn.secondary:hover{color:var(--ink);filter:none;background:var(--surface-3)}
.st-link{font-size:12px;font-weight:600;color:var(--ink-3);padding:6px 8px;border-radius:8px;white-space:nowrap}
.st-link:hover{color:var(--ink);background:var(--surface-2)}
.stat-chips{display:flex;gap:5px;flex-wrap:wrap;flex-basis:100%}
.stat-chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:4px 8px;border-radius:8px;background:var(--surface-2);color:var(--ink-2);font-variant-numeric:tabular-nums}
.stat-chip small{font-weight:600;color:var(--ink-3)}
.stat-note{font-size:12px;color:var(--ink-3);font-weight:600}
@media (max-width:700px){.idea .acts{opacity:1}.idea-foot .meta{flex-basis:100%;margin-left:0}}
.idea .acts{display:flex;gap:4px;flex:none;opacity:.55;transition:opacity .2s}
.idea:hover .acts,.idea:focus-within .acts{opacity:1}
.idea .acts button{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;color:var(--ink-2);transition:background .15s,color .15s}
.idea .acts button:hover{background:var(--surface-2);color:var(--ink)}
.idea .acts button.del:hover{color:var(--personal)}
.edit-form{flex:1;display:flex;flex-direction:column;gap:10px;min-width:0}
.edit-form textarea,.edit-form input,.edit-form select{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:15px;width:100%;resize:vertical}
/* текст сценария: поле растёт под содержимое (см. autosize), минимум — как абзац, максимум — пол-экрана, дальше прокрутка внутри */
.edit-form textarea{min-height:170px;line-height:1.5;resize:none;overflow:hidden}
.edit-form textarea:focus,.edit-form input:focus,.edit-form select:focus{outline:none;border-color:var(--accent)}
.edit-form .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.edit-form .row .pick{width:auto;flex:1;min-width:160px}
/* выбор подтемы — своя кнопка вместо системного select */
.pick{display:flex;align-items:center;gap:10px;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:11px 12px 11px 14px;font-size:15px;font-weight:600;color:var(--ink);text-align:left;transition:border-color .2s,background .2s}
.pick:hover{border-color:var(--line-2)}
.pick .dot{width:10px;height:10px;border-radius:3px;flex:none}
.pick .txt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pick .txt small{color:var(--ink-3);font-weight:500;margin-left:6px}
.pick .chev{flex:none;color:var(--ink-3);display:grid}
.pick-group{margin-top:14px}
.pick-group .lbl{margin:0 0 8px;display:flex;align-items:center;gap:8px}
.pick-group .lbl .sw{width:10px;height:10px;border-radius:3px}
.pick-list{display:flex;flex-direction:column;gap:6px}
.pick-item{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;background:var(--surface-2);border:1px solid transparent;text-align:left;font-weight:600;width:100%;transition:background .2s,border-color .2s,transform .15s}
.pick-item:hover{border-color:var(--line-2);background:var(--surface-3)}
.pick-item .dot{width:12px;height:12px;border-radius:4px;flex:none}
.pick-item .nm{flex:1;min-width:0;line-height:1.25}
.pick-item .nm small{display:block;font-weight:500;font-size:12px;color:var(--ink-3)}
.pick-item .tick{width:22px;height:22px;border-radius:50%;border:2px solid var(--line-2);flex:none;display:grid;place-items:center;color:#fff;transition:background .2s,border-color .2s}
.pick-item .tick svg{width:12px;height:12px;opacity:0}
.pick-item.on{border-color:var(--pc);background:color-mix(in srgb,var(--pc) 12%,var(--surface-2))}
.pick-item.on .tick{background:var(--pc);border-color:var(--pc)}
.pick-item.on .tick svg{opacity:1}
.edit-form .row .btn{padding:10px 16px;font-size:14px}
@media (max-width:700px){
  .idea.editing{padding:12px}
  .edit-form textarea{min-height:220px}
  .edit-form .row .pick{flex-basis:100%}
  .edit-form .row .btn{flex:1;padding:13px 16px}
}
.sub-name-input{font-size:26px;font-weight:800;letter-spacing:-.02em;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:2px 10px;min-width:120px;max-width:100%}

/* ---------- статистика опубликованного ---------- */
.stats-sum{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-top:6px}
.stats-sum .big{font-size:34px;font-weight:800;letter-spacing:-.03em;line-height:1}
.stats-sum .big small{font-size:13px;color:var(--ink-3);font-weight:600;margin-left:6px;letter-spacing:0}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin-top:12px}
.stat-tile{padding:10px 12px;border-radius:12px;background:var(--surface-2);min-width:0}
.stat-tile .k{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat-tile .v{font-size:22px;font-weight:800;letter-spacing:-.02em;margin-top:3px;font-variant-numeric:tabular-nums}
.stat-tile .a{font-size:12px;color:var(--ink-3);font-weight:600;margin-top:2px}
.stat-tile.er{background:color-mix(in srgb,var(--good) 14%,var(--surface-2))}
.stats-note{margin-top:10px;font-size:12px;color:var(--ink-3)}
.seg-stats{margin-bottom:14px}
.seg-stats .card{margin:0}
.stats-form{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stats-form label{display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:700;color:var(--ink-3)}
.stats-form input,.sheet input.date{width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:11px 12px;font-size:16px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}
.stats-form input:focus,.sheet input.date:focus{outline:none;border-color:var(--accent)}
.stats-form input::-webkit-outer-spin-button,.stats-form input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.stats-form input[type=number]{-moz-appearance:textfield;appearance:textfield}

/* поле «Подписалось» — седьмое, одно в последнем ряду: растягиваем на всю ширину */
.stats-form label:last-child:nth-child(odd){grid-column:1/-1}

/* ---------- рейтинг роликов подтемы ---------- */
.rate-card{margin-top:14px}
.rate-axes{font-size:12px;font-weight:600;color:var(--ink-3);white-space:nowrap}
.rate-verdict{display:flex;flex-direction:column;gap:6px;margin-top:12px;padding:12px 14px;border-radius:12px;background:var(--surface-2);font-size:14px;color:var(--ink-2);line-height:1.45}
.rate-verdict .ln{display:flex;gap:10px;align-items:flex-start}
.rate-verdict .ic{flex:none;font-size:16px;line-height:1.3}
.rate-verdict b{color:var(--ink);font-weight:700}
.rate-list{display:flex;flex-direction:column;gap:6px;margin-top:12px}
.rate-row{display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:6px 10px;align-items:center;padding:9px 10px;border-radius:10px;background:var(--surface-2);border:1px solid transparent;cursor:pointer;width:100%;text-align:left;transition:border-color .2s,background .2s}
.rate-row:hover{border-color:var(--line-2);background:var(--surface-3)}
.rate-row .num{width:24px;height:24px;border-radius:7px;display:grid;place-items:center;font-size:12px;font-weight:800;flex:none}
.rate-row .t{min-width:0;font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rate-row .t small{display:block;color:var(--ink-3);font-weight:600;font-size:11px;font-variant-numeric:tabular-nums}
.rate-row .sc{font-weight:800;font-size:16px;letter-spacing:-.02em;white-space:nowrap;font-variant-numeric:tabular-nums}
.rate-row .sc small{color:var(--ink-3);font-weight:600;font-size:11px;letter-spacing:0}
.rate-row.top .sc{color:var(--good)}
.rate-row .track{grid-column:1/-1;height:6px;border-radius:3px;background:var(--surface);overflow:hidden;position:relative}
.rate-row .track i{display:block;height:100%;border-radius:3px;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.rate-row .track .avg{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--ink-3);opacity:.9}
/* место в рейтинге — в подписи карточки опубликованного */
.rank-tag{display:inline-flex;align-items:center;gap:4px;font-weight:700;color:var(--ink-2);padding:1px 7px;border-radius:99px;background:var(--surface-2)}
.rank-tag small{color:var(--ink-3);font-weight:600}
.rank-tag.top{color:var(--good)}

/* ---------- экран «Опубликованные» ---------- */
.pub-btn{display:inline-flex;align-items:center;gap:7px;height:38px;padding:0 12px;border-radius:11px;background:var(--surface);border:1px solid var(--line);color:var(--ink-2);font-size:13px;font-weight:700;white-space:nowrap;transition:background .2s,color .2s,border-color .2s}
.pub-btn:hover,.pub-btn.on{background:var(--surface-2);color:var(--ink)}
.pub-btn.on{border-color:var(--good)}
.pub-btn b{min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--good);color:#fff;font-size:11px;display:grid;place-items:center}
.pub-btn b:empty{display:none}
@media (max-width:700px){.pub-btn span{display:none}}
.pubv .view-head .filters{margin:0}
.rate-slot{margin-top:14px}
.rate-slot + .card{margin-top:14px}
.rate-more{display:block;width:100%;margin-top:8px;padding:9px;border-radius:10px;font-size:13px;font-weight:700;color:var(--ink-2);background:var(--surface-2);transition:background .2s,color .2s}
.rate-more:hover{background:var(--surface-3);color:var(--ink)}
.tbl-wrap{overflow-x:auto;margin-top:10px}
.tbl{width:100%;border-collapse:collapse;font-size:13px;white-space:nowrap}
.tbl th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);font-weight:700;text-align:right;padding:6px 8px;border-bottom:1px solid var(--line)}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl td{padding:8px;border-bottom:1px solid var(--line);text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.tbl .nm{display:inline-flex;align-items:center;gap:8px;font-weight:700}
.tbl .nm .dot{width:9px;height:9px;border-radius:3px;flex:none}
.tbl .nm small{color:var(--ink-3);font-weight:600}
.tbl tr.tot td{font-weight:800;border-top:2px solid var(--line-2);border-bottom:0}
.tbl tr.click{cursor:pointer}.tbl tr.click:hover td{background:var(--surface-2)}
.top-list{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.top-row{display:flex;gap:10px;align-items:center;padding:9px 10px;border-radius:10px;background:var(--surface-2);cursor:pointer;border:1px solid transparent;transition:border-color .2s;width:100%;text-align:left}
.top-row:hover{border-color:var(--line-2)}
.top-row .num{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;color:#fff;font-size:12px;font-weight:800;flex:none}
.top-row .t{flex:1;min-width:0;font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top-row .t small{display:block;color:var(--ink-3);font-weight:600;font-size:11px}
.top-row .v{font-weight:800;font-size:14px;white-space:nowrap;font-variant-numeric:tabular-nums}
.top-row .v small{color:var(--ink-3);font-weight:600;font-size:11px;margin-left:4px}
.pub-list-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:20px 0 10px}
.pub-list-head h3{margin:0;font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);font-weight:700}
.pub-list-head .spacer{flex:1}
.pub-list-head .meta{color:var(--ink-3);font-size:13px;font-weight:600}

/* ---------- sheet / overlay ---------- */
.overlay{position:fixed;inset:0;background:rgba(6,8,12,.66);display:grid;place-items:center;padding:16px;z-index:60;animation:fade .25s both}
.overlay.closing{animation:fadeOut .22s both}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes fadeOut{to{opacity:0}}
.sheet{width:min(520px,100%);background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:22px 22px 18px;box-shadow:var(--shadow);transform-origin:var(--ox,50%) var(--oy,50%);animation:pop .4s cubic-bezier(.16,.84,.24,1) both;max-height:calc(100vh - 32px);overflow:auto}
.overlay.closing .sheet{animation:popOut .22s ease-in both}
@keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
@keyframes popOut{to{opacity:0;transform:scale(.8)}}
.sheet::-webkit-scrollbar-track{margin:24px 0}
.sheet h3{margin:0;font-size:20px;font-weight:800;letter-spacing:-.02em;display:flex;align-items:center;gap:10px}
.sheet h3 .sw{width:12px;height:12px;border-radius:4px}
.sheet .lbl{color:var(--ink-3);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;margin:18px 0 8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:8px 13px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);font-weight:600;font-size:13px;color:var(--ink-2);transition:background .2s,color .2s,border-color .2s,transform .15s;display:inline-flex;align-items:center;gap:6px}
.chip:hover{color:var(--ink);border-color:var(--line-2)}
.chip:active{transform:scale(.96)}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.chip .n{opacity:.7;font-weight:600;font-size:12px}
.chip.new{border-style:dashed;background:transparent}
.chip-input{padding:7px 12px;border-radius:99px;background:var(--surface-2);border:1px solid var(--accent);font-size:13px;width:180px;outline:none}
/* поле идеи/сценария: без лимита по длине, растёт под текст (autosize), потом прокрутка внутри */
.sheet textarea{width:100%;min-height:150px;resize:none;overflow:hidden;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:15px;line-height:1.5}
.sheet input.note{width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:11px 14px;font-size:14px;margin-top:8px}
.sheet textarea:focus,.sheet input.note:focus{outline:none;border-color:var(--accent)}
.sheet .foot{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.sheet .err{color:var(--personal);font-size:13px;margin-top:8px;font-weight:600;min-height:18px}
.sheet p.txt{color:var(--ink-2);margin:10px 0 0}
/* телефон: окно выезжает снизу на всю ширину; при открытой клавиатуре ужимается вместе с экраном */
@media (max-width:700px){
  .overlay{display:flex;flex-direction:column;justify-content:flex-end;align-items:stretch;padding:0}
  .sheet{width:100%;max-height:calc(100% - 20px);border-radius:24px 24px 0 0;border-bottom:0;padding:16px 18px calc(18px + env(safe-area-inset-bottom));animation:sheetUp .45s cubic-bezier(.16,.84,.24,1) both;transform-origin:50% 100%;display:flex;flex-direction:column}
  .sheet::before{content:"";width:40px;height:4px;border-radius:2px;background:var(--line-2);margin:0 auto 14px;flex:none}
  .overlay.closing .sheet{animation:sheetDown .25s ease-in both}
  .sheet .foot{margin-top:14px;flex:none}
  .sheet .foot .btn{flex:1;padding:14px 18px;font-size:15px}
  .sheet .foot .btn.secondary{flex:0 0 auto}
  .sheet textarea{min-height:190px;font-size:16px}
  .sheet input.note{font-size:16px}
}
@keyframes sheetUp{from{opacity:0;transform:translateY(60%)}to{opacity:1;transform:none}}
@keyframes sheetDown{to{opacity:0;transform:translateY(40%)}}

/* ---------- toast ---------- */
.toasts{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:80;width:min(440px,calc(100% - 32px))}
.toast{background:var(--ink);color:var(--bg);padding:12px 14px 12px 16px;border-radius:14px;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow);animation:toastIn .35s cubic-bezier(.2,.8,.2,1) both;font-weight:600;font-size:14px}
.toast.hide{animation:toastOut .25s ease-in both}
@keyframes toastIn{from{opacity:0;transform:translateY(16px) scale(.96)}to{opacity:1;transform:none}}
@keyframes toastOut{to{opacity:0;transform:translateY(10px)}}
.toast span{flex:1}
.toast button{color:var(--expert);font-weight:800;padding:6px 10px;border-radius:8px;background:rgba(63,134,230,.12)}
@media (prefers-color-scheme: light){.toast button{color:#9fc5ff;background:rgba(159,197,255,.15)}}

/* ---------- tooltip ---------- */
.tt{position:fixed;pointer-events:none;background:var(--ink);color:var(--bg);padding:8px 11px;border-radius:10px;font-size:12px;font-weight:600;z-index:70;opacity:0;transform:translate(-50%,calc(-100% - 12px)) scale(.96);transition:opacity .15s,transform .15s;white-space:nowrap;box-shadow:var(--shadow)}
.tt.show{opacity:1;transform:translate(-50%,calc(-100% - 12px))}
.tt small{display:block;opacity:.7;font-weight:500}
.hidden-input{display:none}

/* ---------- аккаунт и синхронизация ---------- */
.app.locked{display:none}
.sync{display:inline-flex;align-items:center;gap:7px;height:38px;padding:0 12px;border-radius:11px;background:var(--surface);border:1px solid var(--line);color:var(--ink-3);font-size:12px;font-weight:600;white-space:nowrap;transition:color .2s}
.sync .d{width:8px;height:8px;border-radius:50%;background:var(--ink-3);flex:none;transition:background .3s}
.sync.ok .d{background:var(--good)}
.sync.saving .d{background:var(--expert);animation:blink 1s infinite}
.sync.offline .d{background:var(--warn)}
.sync.error .d{background:var(--personal)}
.sync.error{color:var(--personal)}
@keyframes blink{50%{opacity:.3}}
@media (max-width:700px){.sync span{display:none}.sync{padding:0 12px}}
.menu-wrap{display:flex;align-items:center;gap:8px}
.dropdown .acct{padding:10px 12px 8px;display:flex;flex-direction:column;gap:2px}
.dropdown .acct b{font-weight:700}
.dropdown .acct small{font-size:12px}
.auth{min-height:100vh;display:grid;place-items:center;padding:24px 16px;background:radial-gradient(900px 500px at 15% 0%,rgba(232,93,69,.16),transparent 60%),radial-gradient(900px 500px at 90% 100%,rgba(63,134,230,.18),transparent 60%),var(--bg)}
.auth-card{width:min(420px,100%);background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:26px 24px 22px;box-shadow:var(--shadow);animation:pop .45s cubic-bezier(.16,.84,.24,1) both}
.auth-card .brand{margin-bottom:18px}
.auth-card .brand h1{font-size:20px}
.auth-tabs{display:flex;gap:4px;background:var(--surface-2);border-radius:12px;padding:4px;margin-bottom:16px}
.auth-tabs button{flex:1;padding:9px 10px;border-radius:9px;font-weight:700;font-size:14px;color:var(--ink-3);transition:background .2s,color .2s}
.auth-tabs button.on{background:var(--surface);color:var(--ink);box-shadow:0 2px 8px rgba(0,0,0,.18)}
.auth-form{display:flex;flex-direction:column;gap:10px}
.auth-form label{font-size:12px;font-weight:700;color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em;display:flex;flex-direction:column;gap:6px}
.auth-form input{width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:15px;text-transform:none;letter-spacing:0;font-weight:500}
.auth-form input:focus{outline:none;border-color:var(--expert)}
.auth-form .pw{position:relative}
.auth-form .pw input{padding-right:64px}
.auth-form .pw button{position:absolute;right:8px;top:50%;transform:translateY(-50%);font-size:12px;font-weight:700;color:var(--ink-3);padding:6px 8px;border-radius:8px;text-transform:none;letter-spacing:0}
.auth-form .pw button:hover{color:var(--ink);background:var(--surface-3)}
.auth-form .btn{margin-top:6px;padding:14px 18px;font-size:15px;background:linear-gradient(90deg,var(--personal),var(--expert))}
.auth-form .err{color:var(--personal);font-size:13px;font-weight:600;min-height:18px}
.auth-card .note{color:var(--ink-3);font-size:12px;margin:14px 0 0;text-align:center;line-height:1.5}

<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <div class="logo"></div>
      <div><h1>Баланс контента</h1><small>fuchiji.dance · личное ↔ экспертное</small></div>
    </div>
    <nav class="crumbs" id="crumbs"></nav>
    <div class="menu-wrap">
      <button class="pub-btn" id="pubBtn" title="Все опубликованные ролики и статистика"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4z"/></svg><span>Опубликованные</span><b id="pubCount"></b></button>
      <button class="sync" id="syncPill" title="Состояние синхронизации · нажми, чтобы обновить"><i class="d"></i><span>…</span></button>
      <button class="icon-btn" id="menuBtn" title="Меню" aria-label="Меню">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="5" cy="12" r="1.2" fill="currentColor"/><circle cx="12" cy="12" r="1.2" fill="currentColor"/><circle cx="19" cy="12" r="1.2" fill="currentColor"/></svg>
      </button>
      <div id="menu"></div>
      <input type="file" id="importFile" class="hidden-input" accept="application/json">
    </div>
  </header>
  <main class="stage" id="stage"></main>
</div>
<div class="toasts" id="toasts"></div>
<div class="tt" id="tt"></div>

<script>
/* ===================================================================
   Данные
   =================================================================== */
const KEY = 'fuchiji-content-balance-v1';
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-3);

/* Форматы съёмки по подтемам — из того же рилса «Ваш блог»:
   мысли → разговорный рилс, жизнь → сторис 3 р./нед., польза → посты, карусели и рилс,
   продукт → пост и истории, результаты клиентов → рилс. */
const FORMATS = {
  'ваши мысли': 'разговорный рилс', 'ваша жизнь': 'сторис 3 р./нед.', 'другое': 'танцы и прочее',
  'польза': 'посты, карусели и рилс', 'продукт': 'пост и истории', 'результаты клиентов': 'рилс'
};
/* «Другое» в личном — свои танцы и всё, что не мысли и не жизнь. Фиксированный id, чтобы
   миграция на разных устройствах не плодила дубли при слиянии */
const OTHER_ID = 'personal-other';
function defaultState() {
  // структура один в один из рилса «Ваш блог»: личное / экспертное и пять секторов
  const sub = (name, shade) => ({ id: uid(), name, shade, hint: FORMATS[name.toLowerCase()], updatedAt: 0 });
  return {
    version: 5,
    categories: [
      { id: 'personal', name: 'Личное', color: '#E85D45', subtopics: [sub('Ваши мысли', 0), sub('Ваша жизнь', 1), { ...sub('Другое', 2), id: OTHER_ID }] },
      { id: 'expert', name: 'Экспертное', color: '#3F86E6', subtopics: [sub('Польза', 0), sub('Продукт', 1), sub('Результаты клиентов', 2)] }
    ],
    ideas: [],
    plans: {},
    lastPlan: 8,
    tombstones: {},   // id удалённой идеи/подтемы → когда удалили; нужно для слияния между устройствами
    updatedAt: 0
  };
}
function normalizeState(s) {
  if (!s || !Array.isArray(s.categories) || !Array.isArray(s.ideas)) return null;
  if ((s.version || 1) < 2 && !s.ideas.length) return defaultState(); // старая пустая разметка → схема из рилса
  if ((s.version || 1) < 3) {
    // v2 → v3: форматы без слова «закреплённый», как просили; свои подтемы не трогаем
    for (const c of s.categories) for (const sb of c.subtopics) {
      const f = FORMATS[(sb.name || '').toLowerCase()];
      if (f && (!sb.hint || /закреп/i.test(sb.hint) || sb.hint === 'карусели и рилс')) sb.hint = f;
    }
  }
  s.plans = s.plans || {}; s.tombstones = s.tombstones || {}; s.updatedAt = s.updatedAt || 0;
  if ((s.version || 1) < 4) {
    // v3 → v4: подтема «Другое» в личном (если её не удаляли и нет своей с таким именем)
    const p = s.categories.find(c => c.id === 'personal');
    if (p && !s.tombstones[OTHER_ID] && !p.subtopics.some(sb => sb.id === OTHER_ID || (sb.name || '').trim().toLowerCase() === 'другое'))
      p.subtopics.push({ id: OTHER_ID, name: 'Другое', shade: nextShade(p), hint: FORMATS['другое'], updatedAt: Date.now() });
  }
  if ((s.version || 1) < 5) {
    // v4 → v5: статус «опубликовано» и статистика; опубликованный ролик всегда считается и снятым
    for (const i of s.ideas) if (i.published && !i.done) { i.done = true; i.doneAt = i.doneAt || i.publishedAt || Date.now(); }
  }
  s.version = 5;
  return s;
}

let state = load();
function load() {
  try { const s = normalizeState(JSON.parse(localStorage.getItem(KEY))); if (s) return s; } catch (e) {}
  return defaultState();
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }
/* любое изменение данных: метка версии, локальное сохранение, отправка на сервер */
function persist() {
  state.updatedAt = Date.now();
  const old = Date.now() - 120 * 864e5;
  for (const k in state.tombstones) if (state.tombstones[k] < old) delete state.tombstones[k];
  save(); Sync.schedulePush();
}
function tombstone(id) { state.tombstones[id] = Date.now(); }

/* --- селекторы --- */
const cat = id => state.categories.find(c => c.id === id);
const subOf = (catId, subId) => (cat(catId) || { subtopics: [] }).subtopics.find(s => s.id === subId);
const ideasIn = (catId, subId) => state.ideas.filter(i => i.catId === catId && (!subId || i.subId === subId));
const monthKey = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
const nowKey = () => monthKey(new Date());
function planFor(key) {
  if (key in state.plans) return state.plans[key];
  return state.lastPlan ?? 8;
}
function doneInMonth(key) { return state.ideas.filter(i => i.done && i.doneAt && monthKey(new Date(i.doneAt)) === key); }

/* --- статусы и статистика ---
   Ролик проходит три состояния: в очереди → снято (done) → опубликовано (published).
   Опубликованный остаётся и «снятым», поэтому план на месяц по съёмке считается как раньше.
   Вся статистика (баланс, анализ, отчёт) — только по опубликованным, и без сторис. */
const METRICS = [['views', 'Просмотры', '👁'], ['likes', 'Лайки', '❤️'], ['comments', 'Комментарии', '💬'], ['reposts', 'Репосты', '🔁'], ['shares', 'Пересылки', '✈️'], ['saves', 'Сохранения', '🔖'], ['followers', 'Подписалось', '👤']];
/* реакции для ER — подписки в них не входят: это результат ролика, а не вовлечённость */
const ENG = ['likes', 'comments', 'reposts', 'shares', 'saves'];
/* сторис — единственный сегмент, который в статистику не идёт: «Ваша жизнь» (сторис 3 р./нед.) */
const isStories = sb => !!sb && (/^сторис/i.test(sb.hint || '') || (sb.name || '').trim().toLowerCase() === 'ваша жизнь');
const isStoriesIdea = i => isStories(subOf(i.catId, i.subId));
const inStats = i => !!i.published && !isStoriesIdea(i);
const pubAt = i => i.publishedAt || i.doneAt || i.createdAt || 0;
const hasStats = st => !!st && METRICS.some(([k]) => +st[k] > 0);
const statusOf = i => i.published ? 'pub' : i.done ? 'done' : 'todo';
/* ER — вовлечённость: все реакции ÷ просмотры, в процентах */
const erOf = st => hasStats(st) && +st.views > 0 ? ENG.reduce((a, k) => a + Math.max(0, +st[k] || 0), 0) / +st.views * 100 : null;
function aggStats(ideas) {
  const r = { n: ideas.length, withStats: 0, er: null };
  for (const [k] of METRICS) r[k] = 0;
  for (const i of ideas) {
    if (!hasStats(i.stats)) continue;
    r.withStats++;
    for (const [k] of METRICS) r[k] += Math.max(0, +i.stats[k] || 0);
  }
  if (r.views) r.er = ENG.reduce((a, k) => a + r[k], 0) / r.views * 100;
  return r;
}
/* сколько подписалось на 1 000 просмотров — конверсия ролика в подписку */
const convOf = st => hasStats(st) && +st.views > 0 ? (+st.followers || 0) / +st.views * 1000 : null;
/* --- рейтинг роликов внутри набора (подтемы) ---
   Индекс 0–100: по каждой оси ролик получает долю от лучшего в наборе, индекс — среднее по осям.
   Оси: охват (просмотры), вовлечённость (ER), рост (подписалось). Ось выпадает, если по ней у всех нули,
   чтобы ролики без подписок не тянули вниз тех, у кого подписки просто не вписаны. */
const RATE_AXES = [['views', 'просмотры', st => +st.views || 0], ['er', 'ER', st => erOf(st) || 0], ['followers', 'подписки', st => +st.followers || 0]];
function rateIdeas(ideas) {
  const xs = ideas.filter(i => hasStats(i.stats));
  const axes = RATE_AXES.map(([k, lbl, f]) => ({ k, lbl, f, max: Math.max(0, ...xs.map(i => f(i.stats))) })).filter(a => a.max > 0);
  const rows = xs.map(i => ({ i, score: axes.length ? Math.round(axes.reduce((a, x) => a + x.f(i.stats) / x.max, 0) / axes.length * 100) : 0 }));
  rows.sort((a, b) => b.score - a.score || (+b.i.stats.views || 0) - (+a.i.stats.views || 0));
  rows.forEach((r, n) => { r.rank = n + 1; r.of = rows.length; });
  return { rows, axes, byId: Object.fromEntries(rows.map(r => [r.i.id, r])) };
}
const fmtInt = n => Math.round(n).toLocaleString('ru-RU');
const fmtX = v => v.toFixed(v < 10 ? 1 : 0).replace('.', ',') + '×';
const fmtPct = v => v == null ? '—' : v.toFixed(1).replace('.', ',') + '%';
const toDateInput = ts => { const d = new Date(ts || Date.now()); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };

/* --- цвета подтем: устойчивые оттенки базового цвета категории --- */
const SHADES = [[0, 0], [-12, -15], [12, 13], [-22, 6], [18, -9], [-6, 20], [8, -20], [-28, 0], [26, 6]];
function hexToHsl(hex) {
  const n = parseInt(hex.slice(1), 16); let r = (n >> 16) / 255, g = (n >> 8 & 255) / 255, b = (n & 255) / 255;
  const mx = Math.max(r, g, b), mn = Math.min(r, g, b); let h = 0, s = 0, l = (mx + mn) / 2;
  if (mx !== mn) { const d = mx - mn; s = l > .5 ? d / (2 - mx - mn) : d / (mx + mn);
    h = mx === r ? (g - b) / d + (g < b ? 6 : 0) : mx === g ? (b - r) / d + 2 : (r - g) / d + 4; h *= 60; }
  return [h, s * 100, l * 100];
}
function subColor(c, sub) {
  const [h, s, l] = hexToHsl(c.color);
  const [dh, dl] = SHADES[(sub.shade ?? 0) % SHADES.length];
  return `hsl(${(h + dh + 360) % 360} ${Math.min(95, s)}% ${Math.max(30, Math.min(70, l + dl))}%)`;
}
function nextShade(c) {
  const used = new Set(c.subtopics.map(s => s.shade));
  for (let i = 0; i < 50; i++) if (!used.has(i)) return i;
  return c.subtopics.length;
}

/* --- словоформы --- */
function plural(n, one, few, many) {
  const a = Math.abs(n) % 100, b = a % 10;
  if (a > 10 && a < 20) return many; if (b > 1 && b < 5) return few; if (b === 1) return one; return many;
}
/* перенос подписи на кольце: по словам, не длиннее max символов в строке;
   строки стараемся сделать одинаковой длины («(посты, карусели» / «и рилс)»), а не жадно */
function wrapLabel(text, max) {
  const words = String(text).split(/ +/).filter(Boolean);   // неразрывный пробел не рвём
  const greedy = lim => {
    const lines = []; let cur = '';
    for (const w of words) {
      if (!cur) cur = w;
      else if ((cur + ' ' + w).length <= lim) cur += ' ' + w;
      else { lines.push(cur); cur = w; }
    }
    if (cur) lines.push(cur);
    return lines;
  };
  const best = greedy(max), n = best.length;
  if (n <= 1) return best.length ? best : [''];
  const total = words.join(' ').length;
  for (let lim = Math.ceil(total / n); lim < max; lim++) { const l = greedy(lim); if (l.length === n) return l; }
  return best;
}
const pIdeas = n => `${n} ${plural(n, 'идея', 'идеи', 'идей')}`;
const pVideos = n => `${n} ${plural(n, 'ролик', 'ролика', 'роликов')}`;
const pDays = n => `${n} ${plural(n, 'день', 'дня', 'дней')}`;
const MONTHS_ACC = ['январь', 'февраль', 'март', 'апрель', 'май', 'июнь', 'июль', 'август', 'сентябрь', 'октябрь', 'ноябрь', 'декабрь'];
const MONTHS_PREP = ['январе', 'феврале', 'марте', 'апреле', 'мае', 'июне', 'июле', 'августе', 'сентябре', 'октябре', 'ноябре', 'декабре'];
const MONTHS_SHORT = ['янв', 'фев', 'мар', 'апр', 'мая', 'июн', 'июл', 'авг', 'сен', 'окт', 'ноя', 'дек'];
const fmtDate = ts => { const d = new Date(ts); return `${d.getDate()} ${MONTHS_SHORT[d.getMonth()]}`; };
/* доли в процентах; равные значения всегда дают равные проценты */
function shares(values) {
  const t = values.reduce((a, b) => a + b, 0);
  if (!t) return values.map(() => 0);
  return values.map(v => Math.round(v / t * 100));
}

/* ===================================================================
   DOM-утилиты
   =================================================================== */
function h(tag, attrs = {}, ...kids) {
  const [t, ...cls] = tag.split('.');
  const el = document.createElement(t || 'div');
  if (cls.length) el.className = cls.join(' ');
  for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k === 'class') el.className += (el.className ? ' ' : '') + v;
    else if (k === 'style') el.style.cssText = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k === 'html') el.innerHTML = v;
    else if (k in el && k !== 'list') { try { el[k] = v; } catch (e) { el.setAttribute(k, v); } }
    else el.setAttribute(k, v);
  }
  for (const k of kids.flat()) if (k != null && k !== false) el.append(k.nodeType ? k : document.createTextNode(k));
  return el;
}
const svgNS = 'http://www.w3.org/2000/svg';
function s(tag, attrs = {}, ...kids) {
  const el = document.createElementNS(svgNS, tag);
  for (const [k, v] of Object.entries(attrs)) if (v != null) el.setAttribute(k, v);
  for (const k of kids.flat()) if (k != null) el.append(k.nodeType ? k : document.createTextNode(k));
  return el;
}
const ICONS = {
  check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"/></svg>',
  edit: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/></svg>',
  trash: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/></svg>',
  back: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>',

const stage = document.getElementById('stage');

    // план
    const now = new Date(), key = nowKey(), target = planFor(key);
    const dim = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate(), day = now.getDate(), left = dim - day;
    const done = doneInMonth(key).length;

    } else {

      const expected = target * day / dim;

      else { planStatus.textContent = `⏱ Отстаёшь на ${pVideos(Math.ceil(expected - done))} — догоняй`; planStatus.classList.add('behind'); ringBar.style.stroke = 'var(--warn)'; }
    }
    const prev = new Date(now.getFullYear(), now.getMonth() - 1, 1), pk = monthKey(prev);
    const prevDone = doneInMonth(pk).length, prevPlan = pk in state.plans ? state.plans[pk] : null;
    const donePM = doneInMonth(key), pmP = donePM.filter(i => i.catId === P.id).length;

    // баланс опубликованного (сторис не считаем)
    const dP = ideasP.filter(inStats).length, dE = ideasE.filter(inStats).length, dT = dP + dE;
    const waiting = state.ideas.filter(i => i.done && !i.published && !isStoriesIdea(i)).length;
    const [bp, be] = shares([dP, dE]);
    balBig.innerHTML = `${dT}<small>${plural(dT, 'ролик опубликован', 'ролика опубликовано', 'роликов опубликовано')} · снято, ждут публикации ${waiting}</small>`;

    balLegend.innerHTML = '';

      h('div.it', {}, h('span.dot', { style: `background:${E.color}` }), `${E.name} `, h('b', {}, dT ? `${dE} · ${be}%` : '0')));
    // совет
    let tip;
    if (!total) tip = ['✨', 'Добавь первую идею — диаграмма оживёт. Начни с того, что снял бы уже завтра.'];
    else if (!dT) tip = ['🎬', waiting ? `Снято ${pVideos(waiting)}, но ничего ещё не вышло. Выложил — нажми «Опубликовано» под сценарием, и здесь появится баланс.` : `Идей уже ${total}, опубликованных пока нет. Снял — нажми «Снято», выложил — «Опубликовано»: здесь появится баланс.`];
    else if (dP === dE) tip = ['⚖️', h('span', {}, 'Вышедшее в идеальном балансе ', h('b', {}, '50/50'), '. Держи ритм.')];
    else {

      tip = ['🎯', h('span', {}, 'Следующим выкладывай ', h('b', { style: `color:${lag.color}` }, lag.name.toLowerCase()), `: отстаёт на ${pVideos(diff)}. `, pool ? `В работе ${pIdeas(pool)}.` : 'Идей в работе нет — добавь.')];
    }
    balTip.innerHTML = ''; balTip.append(h('span.ic', {}, tip[0]), h('span', {}, tip[1]));
  }

  return { el, update, zoomTarget: key => donut.segEl(key) };

/* ===================================================================
   Анализ опубликованного — только вышедшие рилсы и посты, чисто количественно
   =================================================================== */
const AN_PERIODS = [[30, '30 дней'], [90, '90 дней'], [0, 'всё время']];
const fmtNum = v => Number.isInteger(v) ? String(v) : v.toFixed(1).replace('.', ',');
/* какого контента не хватает: считаем по опубликованным роликам за период, сторис не участвуют */
function analyze(days) {
  const since = days ? Date.now() - days * 864e5 : 0;
  const done = state.ideas.filter(i => inStats(i) && pubAt(i) >= since);
  const D = done.length, nc = state.categories.length || 1;
  const cats = state.categories.map(c => {
    const n = done.filter(i => i.catId === c.id).length;
    const subs = c.subtopics.filter(sb => !isStories(sb)).map(sb => ({
      cat: c, sub: sb, color: subColor(c, sb),
      done: done.filter(i => i.subId === sb.id).length,
      queue: ideasIn(c.id, sb.id).filter(i => !i.done).length
    }));
    const avg = subs.length ? n / subs.length : 0;
    // ярлыки «мало/много» имеют смысл, когда в линии уже есть хоть какая-то выборка
    const judge = subs.length > 1 && n >= 3;
    return { cat: c, done: n, expected: D / nc, subs, avg, judge };
  });
  // «что снимать дальше»: жадно — сначала линия, где снято меньше, внутри неё подтема, где снято меньше всего
  const sim = cats.map(c => ({ done: c.done, subs: c.subs.map(x => ({ x, done: x.done })) }));
  const next = [];
  for (let k = 0; k < 5; k++) {
    const pool = sim.filter(c => c.subs.length);
    if (!pool.length) break;
    pool.sort((a, b) => a.done - b.done || b.subs.length - a.subs.length);
    const c = pool[0];
    c.subs.sort((a, b) => a.done - b.done || b.x.queue - a.x.queue);
    const sb = c.subs[0];
    next.push(sb.x); c.done++; sb.done++;
  }
  return { D, cats, next };
}
function AnalysisCard() {
  const filters = h('div.filters');
  const sumBig = h('div.big'), sumBar = h('div.bar'), legend = h('div.legend'), verdict = h('div.an-verdict');
  const cols = h('div.an-cols'), seq = h('div.an-seq');
  const nextBox = h('div.an-next', {}, h('h4', {}, 'Что снимать дальше, чтобы выровнять баланс'), seq);
  const el = h('div.card.an-card', {},
    h('div.an-head', {}, h('h3', {}, 'Анализ опубликованного · только вышедшее'), filters),
    h('div.an-sum', {}, sumBig, sumBar), legend, verdict, cols, nextBox,
    h('p.an-foot', {}, 'Считаются только опубликованные рилсы и посты — сторис, очередь и снятое без публикации не учитываются. Ориентир: линии 50/50, внутри линии — подтемы поровну. Штрих на полоске — среднее по линии.'));
  const openSub = (x, e) => go({ level: 'sub', catId: x.cat.id, subId: x.sub.id }, { dir: 'in', origin: originFromEl(e.currentTarget) });
  function update() {
    const period = state.analysisPeriod ?? 0;
    filters.innerHTML = '';
    for (const [d, lbl] of AN_PERIODS) filters.append(h('button', { class: period === d ? 'on' : '', onclick: () => { state.analysisPeriod = d; commit(); } }, lbl));
    const { D, cats, next } = analyze(period);
    const periodTxt = period ? `за ${period} дней` : 'за всё время';
    sumBig.innerHTML = `${D}<small>${plural(D, 'ролик опубликован', 'ролика опубликовано', 'роликов опубликовано')} ${periodTxt}</small>`;
    const pct = shares(cats.map(c => c.done));
    sumBar.innerHTML = ''; legend.innerHTML = ''; cols.innerHTML = ''; seq.innerHTML = ''; verdict.innerHTML = '';
    cats.forEach((c, i) => {
      if (D) sumBar.append(h('i', { style: `width:${pct[i]}%;background:${c.cat.color}` }));
      legend.append(h('div.it', {}, h('span.dot', { style: `background:${c.cat.color}` }), `${c.cat.name} `, h('b', {}, D ? `${c.done} · ${pct[i]}%` : '0')));
    });
    nextBox.hidden = !D;
    if (!D) {
      verdict.append(h('span.ic', {}, '📊'), h('span', {}, `Опубликованных роликов ${periodTxt} нет. Нажми «Опубликовано» у того, что уже вышло, — анализ считает только вышедшее, а не планы.`));
      return;
    }
    // вердикт: какой линии и каких подтем не хватает
    const sorted = [...cats].sort((x, y) => x.done - y.done);
    const lag = sorted[0], lead = sorted[sorted.length - 1], diff = lead.done - lag.done;
    const zeroSubs = cats.flatMap(c => c.subs).filter(x => !x.done);
    const weak = cats.flatMap(c => c.subs.filter(x => x.done && c.judge && x.done < c.avg - .34));
    const parts = [];
    if (diff === 0) parts.push(h('span', {}, 'Линии в балансе ', h('b', {}, '50/50'), '. '));
    else parts.push(h('span', {}, 'Не хватает линии ', h('b', { style: `color:${lag.cat.color}` }, `«${lag.cat.name}»`), `: отстаёт на ${pVideos(diff)}. `));
    if (zeroSubs.length) parts.push(h('span', {}, 'Ни разу не снято: ', h('b', {}, zeroSubs.map(x => x.sub.name).join(', ')), '. '));
    else parts.push('Каждая подтема закрыта хотя бы раз. ');
    if (weak.length) parts.push(h('span', {}, 'Ниже среднего по своей линии: ', h('b', {}, weak.map(x => x.sub.name).join(', ')), '.'));
    verdict.append(h('span.ic', {}, diff === 0 && !zeroSubs.length && !weak.length ? '⚖️' : '🎯'), h('span', {}, parts));
    // колонки по линиям: подтемы от самой редкой к самой частой
    for (const c of cats) {
      const col = h('div.an-col', {}, h('div.an-cat', {}, h('span.dot', { style: `background:${c.cat.color}` }), c.cat.name,
        h('span.cnt', {}, h('b', {}, c.done), ` из ${D} · норма ${fmtNum(c.expected)}`)));
      if (!c.subs.length) col.append(h('div.empty', { style: 'padding:14px' }, 'Подтем нет'));
      const scale = Math.max(1, ...c.subs.map(x => x.done), Math.ceil(c.avg));
      for (const x of [...c.subs].sort((p, q) => p.done - q.done)) {
        let tag = null;
        if (!x.done) tag = h('span.tag.zero', {}, 'ни разу');
        else if (c.judge && x.done < c.avg - .34) tag = h('span.tag.low', {}, 'мало');
        else if (c.judge && x.done > c.avg + .34) tag = h('span.tag.hi', {}, 'много');
        col.append(h('div.an-row', { title: `Открыть «${x.sub.name}» · в очереди ${pIdeas(x.queue)}`, onclick: e => openSub(x, e) },
          h('span.nm', {}, h('span', {}, x.sub.name), tag),
          h('span.n', {}, x.done),
          h('span.track', {}, h('i', { style: `width:${x.done / scale * 100}%;background:${x.color}` }),
            c.subs.length > 1 ? h('span.avg', { style: `left:${Math.min(99, c.avg / scale * 100)}%` }) : null)));
      }
      cols.append(col);
    }
    // рекомендованная последовательность
    // одинаковые подряд схлопываем: «Ваша жизнь ×3»
    const groups = [];
    for (const x of next) { const g = groups[groups.length - 1]; if (g && g.x === x) g.n++; else groups.push({ x, n: 1 }); }
    groups.forEach(({ x, n }, i) => {
      if (i) seq.append(h('span.arr', {}, '→'));
      seq.append(h('button.step', { onclick: e => openSub(x, e) },
        h('span.num', { style: `background:${x.color}` }, i + 1), x.sub.name, n > 1 ? h('b', {}, `×${n}`) : null,
        h('small', {}, x.queue ? `· ${x.queue} в очереди` : '· идей нет')));
    });
  }
  update();
  return { el, update };
}

function newSubtopicInline(list, c) {
  if (list.querySelector('.inline-new')) return;
  const inp = h('input.chip-input', { placeholder: 'Название подтемы', style: 'width:100%;border-radius:12px;padding:12px 14px' });
  const wrap = h('div.inline-new', { style: 'margin-top:6px' }, inp);
  list.append(wrap); inp.focus();
  let fired = false;
  const finish = () => {
    if (fired) return; fired = true;
    const name = inp.value.trim(); wrap.remove();
    if (!name) return;
    c.subtopics.push({ id: uid(), name, shade: nextShade(c), updatedAt: Date.now() });
    commit(); toast(`Подтема «${name}» создана`);
  };
  inp.addEventListener('keydown', e => { if (e.key === 'Enter') finish(); if (e.key === 'Escape') { inp.value = ''; finish(); } });
  inp.addEventListener('blur', finish);
}

  const form = h('form.add-form', { onsubmit: e => {
    e.preventDefault();
    if (getComputedStyle(input).display === 'none') { openAddSheet(catId, subId, e, { lockSub: true }); return; }
    const v = input.value.trim(); if (!v) { input.focus(); return; }
    addIdea(catId, subId, v, ''); input.value = ''; input.focus();
  } }, input, h('button.btn', { type: 'submit' }, '+ Добавить'));
  const filters = h('div.filters');
  const segStats = h('div.seg-stats');   // статистика подтемы — видна на вкладке «Опубликовано»
  const ul = h('ul.ideas');
  el.append(
    h('div.view-head', {},
      h('button.back', { onclick: () => go({ level: 'cat', catId }, { dir: 'out' }) }, icon('back'), c.name),
      title, meta, h('span.spacer'), renameBtn, delBtn),
    form, filters, segStats, ul);

  function startRename() {
    const sb = subOf(catId, subId); if (!sb) return;
    const inp = h('input.sub-name-input', { value: sb.name, maxlength: 60 });
    title.replaceWith(inp); inp.focus(); inp.select();
    let fired = false;
    const finish = () => {
      if (fired) return; fired = true;
      const v = inp.value.trim(); inp.replaceWith(title);
      if (v && v !== sb.name) { sb.name = v; sb.updatedAt = Date.now(); commit(); toast('Подтема переименована'); }
    };
    inp.addEventListener('keydown', e => { if (e.key === 'Enter') finish(); if (e.key === 'Escape') { inp.value = sb.name; finish(); } });
    inp.addEventListener('blur', finish);
  }
  function deleteSub() {
    const sb = subOf(catId, subId), ideas = ideasIn(catId, subId);
    if (ideas.length) { toast(`В подтеме ${pIdeas(ideas.length)} — сначала перенеси или удали их`); return; }
    const idx = c.subtopics.indexOf(sb); c.subtopics.splice(idx, 1); tombstone(sb.id);
    persist(); go({ level: 'cat', catId }, { dir: 'out' });
    toast(`Подтема «${sb.name}» удалена`, { action: 'Отменить', onAction: () => { delete state.tombstones[sb.id]; sb.updatedAt = Date.now(); c.subtopics.splice(idx, 0, sb); commit(); } });
  }
  let rating = null;   // рейтинг опубликованных этой подтемы — считается на вкладке «Опубликовано»
  const ctx = i => ({ editing: editingId === i.id, rank: rating && rating.byId[i.id], setEditing: id => { editingId = id; update(); } });
  function update() {
    const sb = subOf(catId, subId);
    if (!sb) { go({ level: 'cat', catId }, { dir: 'out' }); return; }
    title.querySelector('.tname').textContent = sb.name;
    title.querySelector('.fmt').textContent = sb.hint ? `(${sb.hint})` : '';
    const all = ideasIn(catId, subId);
    const todo = all.filter(i => !i.done), done = all.filter(i => i.done && !i.published), pub = all.filter(i => i.published);
    meta.textContent = `${pIdeas(all.length)} · снято ${done.length + pub.length} · вышло ${pub.length}`;
    delBtn.style.display = all.length ? 'none' : '';
    filters.innerHTML = '';
    for (const [k, lbl, n] of [['todo', 'В очереди', todo.length], ['done', 'Снято', done.length], ['pub', 'Опубликовано', pub.length]])
      filters.append(h('button', { class: filter === k ? 'on' : '', onclick: () => { filter = k; update(); } }, `${lbl} ${n}`));
    // статистика сегмента — только по опубликованным этой подтемы; сторис в статистику не идут
    segStats.innerHTML = ''; rating = null;
    if (filter === 'pub') {
      if (isStories(sb)) segStats.append(h('div.tip', {}, h('span.ic', {}, 'ℹ️'), h('span', {}, 'Это сторис — в статистику и анализ они не входят. Здесь просто список того, что вышло.')));
      else {
        segStats.append(h('div.card', {}, h('h3', {}, `Статистика · ${sb.name} · только опубликованное`), statsBlock(aggStats(pub))));
        rating = rateIdeas(pub);
        if (rating.rows.length) segStats.append(ratingCard(rating, { title: `Рейтинг роликов · ${sb.name}`, col: subColor(c, sb), scope: 'в подтеме' }));
      }
    }
    const shown = filter === 'todo' ? todo.sort((a, b) => b.createdAt - a.createdAt)
      : filter === 'done' ? done.sort((a, b) => (b.doneAt || 0) - (a.doneAt || 0))
      : pub.sort((a, b) => pubAt(b) - pubAt(a));
    ul.innerHTML = '';
    if (!shown.length) {
      const txt = !all.length ? h('span', {}, 'Идей пока нет. Впиши первую — хук, сценарий или просто мысль ', h('b', {}, '«снять про…»'), '.')
        : filter === 'todo' ? 'Очередь пуста — всё снято. Добавь новую идею.'
        : filter === 'done' ? h('span', {}, 'Снятых, но ещё не опубликованных нет. Кнопка ', h('b', {}, '«Снято»'), ' под сценарием в очереди переносит его сюда.')
        : h('span', {}, 'Опубликованных пока нет. В разделе «Снято» нажми ', h('b', {}, '«Опубликовано»'), ' у вышедшего ролика.');
      ul.append(h('div.empty', {}, txt));
    }
    for (const i of shown) ul.append(ideaCard(i, ctx(i)));
  }
  update();
  setTimeout(() => { if (!ideasIn(catId, subId).length) input.focus({ preventScroll: true }); }, 650);
  return { el, update, zoomTarget: () => null };
}

/* ===================================================================
   Выбор подтемы — своя кнопка и окно вместо системного <select>

/* ===================================================================
   Карточка идеи — общая для экрана подтемы и «Опубликованных».
   ctx: editing — карточка в режиме правки; setEditing(id|null) — переключить;
   showPlace — показывать «Линия › Подтема» (в общем списке опубликованных)
   =================================================================== */
function ideaCard(i, ctx = {}) {
  const st = statusOf(i);
  const li = h('li.idea', { class: st, 'data-id': i.id });
  const c = cat(i.catId), sb = subOf(i.catId, i.subId);
