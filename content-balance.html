<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Баланс контента · fuchiji.dance</title>
<meta name="theme-color" content="#0e1015">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Баланс">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0e1015; --surface:#161a22; --surface-2:#1d222c; --surface-3:#252b37;
  --line:#2a303c; --line-2:#343b49;
  --ink:#eef0f4; --ink-2:#aab1bf; --ink-3:#6f7889;
  --personal:#E85D45; --expert:#3F86E6;
  --good:#3fb47a; --warn:#e2a93b;
  --radius:18px; --radius-s:12px;
  --shadow:0 18px 50px rgba(0,0,0,.45);
  --font:"Manrope",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root{
    --bg:#f4f5f8; --surface:#ffffff; --surface-2:#f2f4f8; --surface-3:#e8ebf1;
    --line:#e3e6ec; --line-2:#d3d8e1;
    --ink:#161a22; --ink-2:#4b5363; --ink-3:#8a92a3;
    --shadow:0 18px 50px rgba(20,30,60,.14);
    color-scheme:light;
  }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--expert);outline-offset:2px;border-radius:8px}
::selection{background:rgba(63,134,230,.35)}

.app{max-width:1560px;margin:0 auto;padding:20px 28px 28px}
@media (max-width:860px){.app{padding:16px 16px 40px}}

/* ---------- header ---------- */
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.brand .logo{width:38px;height:38px;border-radius:12px;background:conic-gradient(from -90deg,var(--personal) 0 50%,var(--expert) 50% 100%);position:relative;flex:none}
.brand .logo::after{content:"";position:absolute;inset:11px;border-radius:50%;background:var(--bg)}
.brand h1{font-size:18px;margin:0;font-weight:800;letter-spacing:-.01em}
.brand small{display:block;color:var(--ink-3);font-weight:500;font-size:12px}
.crumbs{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--ink-3);flex-wrap:wrap}
.crumbs button{color:var(--ink-2);padding:6px 10px;border-radius:9px;font-weight:600;transition:background .2s,color .2s}
.crumbs button:hover{background:var(--surface-2);color:var(--ink)}
.crumbs .cur{color:var(--ink);font-weight:700;padding:6px 10px}
.crumbs .sep{opacity:.6}
.menu-wrap{position:relative}
.icon-btn{width:38px;height:38px;border-radius:11px;display:inline-grid;place-items:center;background:var(--surface);border:1px solid var(--line);color:var(--ink-2);transition:background .2s,color .2s,transform .15s}
.icon-btn:hover{background:var(--surface-2);color:var(--ink)}
.icon-btn:active{transform:scale(.94)}
.dropdown{position:absolute;right:0;top:46px;min-width:250px;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:6px;z-index:40;transform-origin:top right;animation:pop .22s cubic-bezier(.2,.8,.2,1) both}
.dropdown button{display:flex;width:100%;text-align:left;padding:10px 12px;border-radius:9px;gap:10px;align-items:center;color:var(--ink);font-weight:500}
.dropdown button:hover{background:var(--surface-2)}
.dropdown button.danger{color:var(--personal)}
.dropdown hr{border:0;border-top:1px solid var(--line);margin:6px 4px}
.dropdown small{display:block;color:var(--ink-3);font-weight:400;font-size:12px}
@media (max-width:700px){.top{gap:10px}.crumbs{order:3;flex-basis:100%;margin-top:-4px}.menu-wrap{margin-left:auto}}

/* ---------- stage & zoom ---------- */
.stage{position:relative;--ox:50%;--oy:50%}
.view{transform-origin:var(--ox) var(--oy)}
.view.enter-in,.view.enter-out,.view.leaving{will-change:transform,opacity}
.view.leaving{position:absolute;inset:0;pointer-events:none;z-index:2}
@keyframes zoomIntoNew{from{opacity:0;transform:scale(.5)}to{opacity:1;transform:none}}
@keyframes zoomAwayOld{to{opacity:0;transform:scale(2.4)}}
@keyframes zoomBackNew{from{opacity:0;transform:scale(1.7)}to{opacity:1;transform:none}}
@keyframes zoomBackOld{to{opacity:0;transform:scale(.45)}}
.view.enter-in{animation:zoomIntoNew .6s cubic-bezier(.16,.84,.24,1) both}
.view.leave-in{animation:zoomAwayOld .55s cubic-bezier(.4,0,.8,.4) both}
.view.enter-out{animation:zoomBackNew .55s cubic-bezier(.16,.84,.24,1) both}
.view.leave-out{animation:zoomBackOld .5s cubic-bezier(.4,0,.8,.4) both}
@media (prefers-reduced-motion:reduce){.view{animation-duration:.01s!important}}

/* ---------- layout ---------- */
.grid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(300px,.85fr);gap:22px;align-items:start}
@media (max-width:860px){.grid{grid-template-columns:1fr}}
/* главный экран и экран категории — во всю высоту окна, кольцо одного размера на обоих */
:is(.home,.cat) .grid{grid-template-columns:minmax(0,1.6fr) minmax(320px,.8fr);align-items:stretch}
.home .side{display:flex;flex-direction:column;gap:16px}
.home .side .card{flex:1;display:flex;flex-direction:column;justify-content:center;margin:0}
:is(.home,.cat) .donut-wrap{width:min(100%,calc(100vh - 330px),720px);min-width:min(100%,280px)}
@media (min-width:861px){
  :is(.home,.cat) .chart-card{min-height:calc(100vh - 122px);justify-content:center;gap:24px;padding:30px 30px 24px}
  .cat .chart-card{min-height:calc(100vh - 190px)}
  :is(.home,.cat) .add-row{max-width:760px}
  :is(.home,.cat) .center .big{font-size:52px}
  :is(.home,.cat) .center .sub{font-size:14px;margin-top:8px}
  .home .ring{width:120px;height:120px}
  .home .ring .val{font-size:30px}
  .home .ring .val small{font-size:12px}
  .home .plan-info .line1{font-size:20px}
  .home .plan-info .line2{font-size:14px}
  .home .bal-nums .big{font-size:38px}
  .home .legend,.home .tip{font-size:14px}
  .home .card h3{font-size:13px}
  :is(.home,.cat) .add-btn{padding:16px 20px;font-size:16px}
}
@media (max-width:860px){:is(.home,.cat) .grid{grid-template-columns:1fr}.home .side .card{flex:none}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px}
.card + .card{margin-top:14px}
.card h3{margin:0 0 4px;font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);font-weight:700}
.chart-card{padding:26px 22px 22px;display:flex;flex-direction:column;align-items:center;gap:14px;position:relative;overflow:hidden}
.chart-card .glow{position:absolute;width:640px;height:640px;border-radius:50%;opacity:.14;pointer-events:none;transition:opacity .6s}
.chart-card .glow.p{background:radial-gradient(closest-side,var(--personal),transparent);left:-220px;top:-200px}
.chart-card .glow.e{background:radial-gradient(closest-side,var(--expert),transparent);right:-220px;bottom:-220px}
.donut-wrap{position:relative;width:min(100%,400px);aspect-ratio:1}
.donut{width:100%;height:100%;display:block;overflow:visible}
.donut .seg{transition:transform .28s cubic-bezier(.2,.8,.2,1),opacity .3s;transform-box:view-box;transform-origin:center;cursor:pointer}
.donut .seg.hover{transform:translate(var(--dx),var(--dy))}
.donut .seg.dim{opacity:.55}
/* пустой сегмент — «слот» направления: бледный, но живой и кликабельный */
.donut .seg.empty{opacity:.3}
.donut .seg.empty.dim{opacity:.2}
.donut .seg.empty.hover{opacity:.55}
.donut .lab{pointer-events:none;fill:#fff;text-anchor:middle;font-family:var(--font)}
.donut .lab .n{font-size:13px;font-weight:600;opacity:.92}
.donut .lab .p{font-size:24px;font-weight:800;letter-spacing:-.02em}
.donut .lab .c{font-size:11px;font-weight:500;opacity:.85}
/* формат съёмки — в скобках сразу под названием сегмента */
.donut .lab .f{font-size:10.5px;font-weight:600;opacity:.8;letter-spacing:.01em}
/* пустой сегмент: название — крупно и читаемо, «пусто» — мелкой подписью под ним */
.donut .lab.empty{fill:var(--ink)}
.donut .lab.empty .n{font-size:16px;font-weight:700;opacity:.9;letter-spacing:-.01em}
.donut .lab.empty .f{opacity:.65}
.donut .lab.empty .p{font-size:11px;font-weight:600;opacity:.55;letter-spacing:.04em;text-transform:uppercase}
.center{position:absolute;inset:0;display:grid;place-items:center;text-align:center;pointer-events:none}
.center .big{font-size:38px;font-weight:800;letter-spacing:-.03em;line-height:1}
.center .sub{color:var(--ink-3);font-size:13px;margin-top:6px;font-weight:600;letter-spacing:0}
.center .sub b{color:var(--ink-2)}
.add-row{display:flex;justify-content:space-between;gap:14px;width:100%;flex-wrap:wrap}
.add-btn{flex:1;min-width:200px;display:flex;align-items:center;justify-content:center;gap:10px;padding:14px 18px;border-radius:14px;font-weight:700;font-size:15px;color:#fff;transition:transform .15s,filter .2s,box-shadow .2s;box-shadow:0 8px 24px -8px currentColor}
.add-btn:hover{filter:brightness(1.08);transform:translateY(-1px)}
.add-btn:active{transform:scale(.97)}
.add-btn .plus{width:24px;height:24px;border-radius:50%;background:rgba(255,255,255,.22);display:grid;place-items:center;font-size:18px;line-height:1}
.add-btn.personal{background:var(--personal)}
.add-btn.expert{background:var(--expert)}
.hint{color:var(--ink-3);font-size:13px;margin:0;text-align:center}
.hint b{color:var(--ink-2);font-weight:600}

/* ---------- plan card ---------- */
.plan-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.plan-body{display:flex;gap:18px;align-items:center;margin-top:10px}
.ring{width:96px;height:96px;flex:none;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:9;stroke-linecap:round}
.ring .track{stroke:var(--surface-3)}
.ring .bar{stroke:var(--good);transition:stroke-dashoffset .8s cubic-bezier(.2,.8,.2,1),stroke .4s}
.ring .val{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;font-size:24px;letter-spacing:-.02em;line-height:1}
.ring .val small{font-size:11px;color:var(--ink-3);font-weight:600;line-height:1;margin-top:4px;letter-spacing:0}
.plan-info{flex:1;min-width:0}
.plan-info .line1{font-size:17px;font-weight:700}
.plan-info .line1 span{color:var(--ink-3);font-weight:600}
.plan-info .line2{color:var(--ink-2);font-size:13px;margin-top:2px}
.plan-info .status{margin-top:8px;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:99px;background:var(--surface-2)}
.status.ok{color:var(--good)}.status.behind{color:var(--warn)}.status.done{color:var(--good)}
.stepper{display:inline-flex;align-items:center;gap:2px;background:var(--surface-2);border-radius:10px;padding:3px}
.stepper button{width:30px;height:30px;border-radius:8px;font-size:18px;font-weight:700;color:var(--ink-2);display:grid;place-items:center;transition:background .15s,color .15s}
.stepper button:hover{background:var(--surface-3);color:var(--ink)}
.stepper .num{min-width:34px;text-align:center;font-weight:800;font-size:16px}
.plan-foot{margin-top:12px;font-size:12px;color:var(--ink-3);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}

/* ---------- done balance ---------- */
.bal-nums{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-top:4px}
.bal-nums .big{font-size:30px;font-weight:800;letter-spacing:-.03em}
.bal-nums .big small{font-size:13px;color:var(--ink-3);font-weight:600;margin-left:6px;letter-spacing:0}
.bar{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--surface-3);margin-top:12px;gap:2px}
.bar i{display:block;height:100%;transition:width .7s cubic-bezier(.2,.8,.2,1)}
.bar i.p{background:var(--personal)}.bar i.e{background:var(--expert)}
.legend{display:flex;justify-content:space-between;gap:10px;margin-top:10px;font-size:13px;flex-wrap:wrap}
.legend .it{display:flex;align-items:center;gap:8px;color:var(--ink-2)}
.legend .dot{width:9px;height:9px;border-radius:50%;flex:none}
.legend b{color:var(--ink);font-weight:700}
.tip{margin-top:12px;padding:10px 12px;border-radius:10px;background:var(--surface-2);font-size:13px;color:var(--ink-2);display:flex;gap:8px;align-items:flex-start}
.tip .ic{flex:none;font-size:15px}
.tip b{color:var(--ink);font-weight:700}

/* ---------- анализ снятого ---------- */
.home .an-card{margin-top:22px;flex:none}
.an-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.an-head h3{margin:0}
.an-head .filters{margin:0}
.an-sum{display:flex;align-items:center;gap:18px;margin-top:14px;flex-wrap:wrap}
.an-sum .big{font-size:34px;font-weight:800;letter-spacing:-.03em;line-height:1}
.an-sum .big small{font-size:13px;color:var(--ink-3);font-weight:600;margin-left:6px;letter-spacing:0}
.an-sum .bar{flex:1;min-width:200px;margin:0}
.an-verdict{margin-top:12px;padding:12px 14px;border-radius:12px;background:var(--surface-2);font-size:14px;color:var(--ink-2);display:flex;gap:10px;align-items:flex-start;line-height:1.4}
.an-verdict .ic{flex:none;font-size:16px}
.an-verdict b{color:var(--ink);font-weight:700}
.an-cols{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:16px}
@media (max-width:760px){.an-cols{grid-template-columns:1fr}}
.an-col{display:flex;flex-direction:column;gap:6px;min-width:0}
.an-col .an-cat{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px;margin-bottom:4px}
.an-col .an-cat .dot{width:10px;height:10px;border-radius:3px}
.an-col .an-cat .cnt{margin-left:auto;color:var(--ink-3);font-weight:600;font-size:13px}
.an-col .an-cat .cnt b{color:var(--ink)}
.an-row{display:grid;grid-template-columns:minmax(0,1fr) 34px;gap:8px 12px;align-items:center;padding:8px 10px;border-radius:10px;background:var(--surface-2);border:1px solid transparent;cursor:pointer;transition:border-color .2s,background .2s}
.an-row:hover{border-color:var(--line-2);background:var(--surface-3)}
.an-row .nm{font-weight:600;font-size:13px;display:flex;align-items:center;gap:8px;min-width:0}
.an-row .nm span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.an-row .tag{font-size:11px;font-weight:700;padding:2px 7px;border-radius:99px;background:var(--surface);color:var(--ink-3);flex:none;letter-spacing:.02em}
.an-row .tag.low{color:var(--warn)}
.an-row .tag.zero{color:var(--personal)}
.an-row .tag.hi{color:var(--good)}
.an-row .n{text-align:right;font-weight:800;font-size:15px}
.an-row .track{grid-column:1/-1;height:6px;border-radius:3px;background:var(--surface);overflow:hidden;position:relative}
.an-row .track i{display:block;height:100%;border-radius:3px;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.an-row .track .avg{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--ink-3);opacity:.9}
.an-next{margin-top:16px}
.an-next h4{margin:0 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);font-weight:700}
.an-seq{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.an-seq .step{display:inline-flex;align-items:center;gap:8px;padding:8px 12px 8px 8px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line);font-size:13px;font-weight:600;color:var(--ink);transition:border-color .2s,transform .15s;cursor:pointer}
.an-seq .step:hover{border-color:var(--line-2);transform:translateY(-1px)}
.an-seq .step .num{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;color:#fff;font-size:12px;font-weight:800;flex:none}
.an-seq .step small{color:var(--ink-3);font-weight:600}
.an-seq .arr{color:var(--ink-3);font-size:14px}
.an-foot{margin-top:12px;font-size:12px;color:var(--ink-3)}

/* ---------- inner views ---------- */
.view-head{display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.back{display:inline-flex;align-items:center;gap:6px;padding:8px 12px 8px 8px;border-radius:10px;background:var(--surface);border:1px solid var(--line);color:var(--ink-2);font-weight:600;font-size:13px;transition:background .2s,color .2s,transform .15s}
.back:hover{background:var(--surface-2);color:var(--ink)}
.back:active{transform:scale(.96)}
.view-head h2{margin:0;font-size:26px;font-weight:800;letter-spacing:-.02em;display:flex;align-items:center;gap:10px;min-width:0}
.view-head h2 .sw{width:14px;height:14px;border-radius:5px;flex:none}
.view-head h2 .fmt{font-size:16px;font-weight:600;color:var(--ink-3);letter-spacing:0;white-space:nowrap}
.view-head h2 .fmt:empty{display:none}
.view-head .meta{color:var(--ink-3);font-size:14px;font-weight:600}
.view-head .spacer{flex:1}
.ghost-btn{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:10px;border:1px dashed var(--line-2);color:var(--ink-2);font-weight:600;font-size:13px;transition:background .2s,color .2s,border-color .2s}
.ghost-btn:hover{background:var(--surface-2);color:var(--ink);border-color:var(--ink-3)}
.ghost-btn.danger:hover{color:var(--personal);border-color:var(--personal)}

.sub-list{display:flex;flex-direction:column;gap:6px}
.sub-row{display:flex;align-items:center;gap:12px;padding:12px 12px;border-radius:12px;background:var(--surface-2);border:1px solid transparent;transition:border-color .2s,transform .15s,background .2s;cursor:pointer}
.sub-row:hover{border-color:var(--line-2);background:var(--surface-3)}
.sub-row:active{transform:scale(.99)}
.sub-row .dot{width:12px;height:12px;border-radius:4px;flex:none}
.sub-row .name{flex:1;font-weight:700;min-width:0;line-height:1.25}
.sub-row .name small{display:block;font-weight:500;font-size:12px;color:var(--ink-3)}
.sub-row .cnt{color:var(--ink-3);font-size:13px;font-weight:600;white-space:nowrap}
.sub-row .cnt b{color:var(--ink-2)}
.sub-row .mini{display:flex;gap:2px;height:6px;width:56px;border-radius:3px;overflow:hidden;background:var(--surface);flex:none}
.sub-row .mini i{display:block;height:100%}
.sub-row .plus{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;color:var(--ink-2);background:var(--surface);font-size:18px;font-weight:700;transition:background .15s,color .15s,transform .15s;flex:none}
.sub-row .plus:hover{color:#fff;transform:scale(1.06)}
.sub-row .arrow{color:var(--ink-3);flex:none}
.empty{text-align:center;color:var(--ink-3);padding:26px 10px;font-size:14px}
.empty b{color:var(--ink-2)}

/* ---------- idea list ---------- */
.add-form{display:flex;gap:10px;margin-bottom:14px}
.add-form input{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:13px 14px;font-size:15px;transition:border-color .2s}
.add-form input::placeholder{color:var(--ink-3)}
.add-form input:focus{border-color:var(--accent,var(--expert));outline:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 18px;border-radius:12px;font-weight:700;background:var(--accent,var(--expert));color:#fff;transition:filter .2s,transform .15s;white-space:nowrap}
.btn:hover{filter:brightness(1.08)}.btn:active{transform:scale(.97)}
.btn.secondary{background:var(--surface-2);color:var(--ink-2)}
.btn.secondary:hover{color:var(--ink);filter:none;background:var(--surface-3)}
.btn:disabled{opacity:.5;cursor:not-allowed;filter:none;transform:none}
.filters{display:flex;gap:4px;margin-bottom:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px;width:max-content;max-width:100%}

<script>
/* ===================================================================
   Данные
   =================================================================== */
const KEY = 'fuchiji-content-balance-v1';
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-3);

/* Форматы съёмки по подтемам — из того же рилса «Ваш блог»:
   мысли → разговорный рилс, жизнь → сторис 3 р./нед., польза → посты, карусели и рилс,
   продукт → пост и истории, результаты клиентов → рилс. */
const FORMATS = {
  'ваши мысли': 'разговорный рилс', 'ваша жизнь': 'сторис 3 р./нед.',
  'польза': 'посты, карусели и рилс', 'продукт': 'пост и истории', 'результаты клиентов': 'рилс'
};
function defaultState() {
  // структура один в один из рилса «Ваш блог»: личное / экспертное и пять секторов
  const sub = (name, shade) => ({ id: uid(), name, shade, hint: FORMATS[name.toLowerCase()], updatedAt: 0 });
  return {
    version: 3,
    categories: [
      { id: 'personal', name: 'Личное', color: '#E85D45', subtopics: [sub('Ваши мысли', 0), sub('Ваша жизнь', 1)] },
      { id: 'expert', name: 'Экспертное', color: '#3F86E6', subtopics: [sub('Польза', 0), sub('Продукт', 1), sub('Результаты клиентов', 2)] }
    ],
    ideas: [],
    plans: {},
    lastPlan: 8,
    tombstones: {},   // id удалённой идеи/подтемы → когда удалили; нужно для слияния между устройствами
    updatedAt: 0

}
function normalizeState(s) {

  if ((s.version || 1) < 3) {

    for (const c of s.categories) for (const sb of c.subtopics) {
      const f = FORMATS[(sb.name || '').toLowerCase()];
      if (f && (!sb.hint || /закреп/i.test(sb.hint) || sb.hint === 'карусели и рилс')) sb.hint = f;
    }

  s.plans = s.plans || {}; s.tombstones = s.tombstones || {}; s.updatedAt = s.updatedAt || 0;
  return s;
}

let state = load();
function load() {
  try { const s = normalizeState(JSON.parse(localStorage.getItem(KEY))); if (s) return s; } catch (e) {}
  return defaultState();
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }
/* любое изменение данных: метка версии, локальное сохранение, отправка на сервер */
function persist() {
  state.updatedAt = Date.now();
  const old = Date.now() - 120 * 864e5;
  for (const k in state.tombstones) if (state.tombstones[k] < old) delete state.tombstones[k];
  save(); Sync.schedulePush();
}
function tombstone(id) { state.tombstones[id] = Date.now(); }

/* --- селекторы --- */
const cat = id => state.categories.find(c => c.id === id);
const subOf = (catId, subId) => (cat(catId) || { subtopics: [] }).subtopics.find(s => s.id === subId);
const ideasIn = (catId, subId) => state.ideas.filter(i => i.catId === catId && (!subId || i.subId === subId));
const monthKey = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
const nowKey = () => monthKey(new Date());
function planFor(key) {
  if (key in state.plans) return state.plans[key];
  return state.lastPlan ?? 8;
}
function doneInMonth(key) { return state.ideas.filter(i => i.done && i.doneAt && monthKey(new Date(i.doneAt)) === key); }

/* --- цвета подтем: устойчивые оттенки базового цвета категории --- */
const SHADES = [[0, 0], [-12, -15], [12, 13], [-22, 6], [18, -9], [-6, 20], [8, -20], [-28, 0], [26, 6]];
function hexToHsl(hex) {
  const n = parseInt(hex.slice(1), 16); let r = (n >> 16) / 255, g = (n >> 8 & 255) / 255, b = (n & 255) / 255;
  const mx = Math.max(r, g, b), mn = Math.min(r, g, b); let h = 0, s = 0, l = (mx + mn) / 2;
  if (mx !== mn) { const d = mx - mn; s = l > .5 ? d / (2 - mx - mn) : d / (mx + mn);

}
function nextShade(c) {
  const used = new Set(c.subtopics.map(s => s.shade));
  for (let i = 0; i < 50; i++) if (!used.has(i)) return i;
  return c.subtopics.length;
}

/* --- словоформы --- */
function plural(n, one, few, many) {
  const a = Math.abs(n) % 100, b = a % 10;

}
const pIdeas = n => `${n} ${plural(n, 'идея', 'идеи', 'идей')}`;
const pVideos = n => `${n} ${plural(n, 'ролик', 'ролика', 'роликов')}`;
const pDays = n => `${n} ${plural(n, 'день', 'дня', 'дней')}`;
const MONTHS_ACC = ['январь', 'февраль', 'март', 'апрель', 'май', 'июнь', 'июль', 'август', 'сентябрь', 'октябрь', 'ноябрь', 'декабрь'];
const MONTHS_PREP = ['январе', 'феврале', 'марте', 'апреле', 'мае', 'июне', 'июле', 'августе', 'сентябре', 'октябре', 'ноябре', 'декабре'];
const MONTHS_SHORT = ['янв', 'фев', 'мар', 'апр', 'мая', 'июн', 'июл', 'авг', 'сен', 'окт', 'ноя', 'дек'];
const fmtDate = ts => { const d = new Date(ts); return `${d.getDate()} ${MONTHS_SHORT[d.getMonth()]}`; };
/* доли в процентах; равные значения всегда дают равные проценты */
function shares(values) {
  const t = values.reduce((a, b) => a + b, 0);
  if (!t) return values.map(() => 0);
  return values.map(v => Math.round(v / t * 100));

/* ===================================================================
   DOM-утилиты
   =================================================================== */
function h(tag, attrs = {}, ...kids) {

const svgNS = 'http://www.w3.org/2000/svg';

const ICONS = {
  check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"/></svg>',
  edit: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/></svg>',
  trash: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/></svg>',
  back: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>',
  arrow: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>',
};
const icon = n => { const t = document.createElement('template'); t.innerHTML = ICONS[n]; return t.content.firstChild; };

/* ===================================================================
   Тосты и подсказки
   =================================================================== */
function toast(msg, opts = {}) {
  const box = document.getElementById('toasts');
  let done = false;
  const el = h('div.toast', {}, h('span', {}, msg));
  if (opts.action) el.append(h('button', { onclick: () => { if (done) return; done = true; opts.onAction && opts.onAction(); kill(); } }, opts.action));
  box.append(el);
  const kill = () => { el.classList.add('hide'); setTimeout(() => el.remove(), 260); };
  setTimeout(() => { if (!done) { done = true; opts.onExpire && opts.onExpire(); kill(); } }, opts.ms || (opts.action ? 7000 : 4500));
}
const tt = document.getElementById('tt');
function showTip(html, x, y) { tt.innerHTML = html; tt.style.left = x + 'px'; tt.style.top = y + 'px'; tt.classList.add('show'); }
function hideTip() { tt.classList.remove('show'); }

/* ===================================================================
   Кольцевая диаграмма с анимацией
   =================================================================== */
function Donut({ size = 360, outer = 172, inner = 96, labelMin = .07, emptySlot = .07, onClick, onHover } = {}) {

/* ===================================================================
   Анализ снятого — только реализованные ролики, чисто количественно
   =================================================================== */
const AN_PERIODS = [[30, '30 дней'], [90, '90 дней'], [0, 'всё время']];
const fmtNum = v => Number.isInteger(v) ? String(v) : v.toFixed(1).replace('.', ',');
/* какого контента не хватает: считаем по снятым (done) роликам за период */
function analyze(days) {
  const since = days ? Date.now() - days * 864e5 : 0;
  const done = state.ideas.filter(i => i.done && (i.doneAt || i.createdAt || 0) >= since);
  const D = done.length, nc = state.categories.length || 1;
  const cats = state.categories.map(c => {
    const n = done.filter(i => i.catId === c.id).length;
    const subs = c.subtopics.map(sb => ({
      cat: c, sub: sb, color: subColor(c, sb),
      done: done.filter(i => i.subId === sb.id).length,
      queue: ideasIn(c.id, sb.id).filter(i => !i.done).length

    const avg = subs.length ? n / subs.length : 0;
    // ярлыки «мало/много» имеют смысл, когда в линии уже есть хоть какая-то выборка
    const judge = subs.length > 1 && n >= 3;
    return { cat: c, done: n, expected: D / nc, subs, avg, judge };
  });
  // «что снимать дальше»: жадно — сначала линия, где снято меньше, внутри неё подтема, где снято меньше всего
  const sim = cats.map(c => ({ done: c.done, subs: c.subs.map(x => ({ x, done: x.done })) }));
  const next = [];
  for (let k = 0; k < 5; k++) {
    const pool = sim.filter(c => c.subs.length);
    if (!pool.length) break;
    pool.sort((a, b) => a.done - b.done || b.subs.length - a.subs.length);
    const c = pool[0];
    c.subs.sort((a, b) => a.done - b.done || b.x.queue - a.x.queue);
    const sb = c.subs[0];
    next.push(sb.x); c.done++; sb.done++;

    for (const [d, lbl] of AN_PERIODS) filters.append(h('button', { class: period === d ? 'on' : '', onclick: () => { state.analysisPeriod = d; commit(); } }, lbl));
    const { D, cats, next } = analyze(period);
    const periodTxt = period ? `за ${period} дней` : 'за всё время';
    sumBig.innerHTML = `${D}<small>${plural(D, 'ролик снят', 'ролика снято', 'роликов снято')} ${periodTxt}</small>`;
    const pct = shares(cats.map(c => c.done));
    sumBar.innerHTML = ''; legend.innerHTML = ''; cols.innerHTML = ''; seq.innerHTML = ''; verdict.innerHTML = '';
    cats.forEach((c, i) => {
      if (D) sumBar.append(h('i', { style: `width:${pct[i]}%;background:${c.cat.color}` }));
      legend.append(h('div.it', {}, h('span.dot', { style: `background:${c.cat.color}` }), `${c.cat.name} `, h('b', {}, D ? `${c.done} · ${pct[i]}%` : '0')));
    });
    nextBox.hidden = !D;
    if (!D) {
      verdict.append(h('span.ic', {}, '📊'), h('span', {}, `Снятых роликов ${periodTxt} нет. Отметь галочкой то, что уже вышло, — анализ считает только реализованное, а не планы.`));
      return;
    }
    // вердикт: какой линии и каких подтем не хватает
    const sorted = [...cats].sort((x, y) => x.done - y.done);
    const lag = sorted[0], lead = sorted[sorted.length - 1], diff = lead.done - lag.done;
    const zeroSubs = cats.flatMap(c => c.subs).filter(x => !x.done);
    const weak = cats.flatMap(c => c.subs.filter(x => x.done && c.judge && x.done < c.avg - .34));
    const parts = [];
    if (diff === 0) parts.push(h('span', {}, 'Линии в балансе ', h('b', {}, '50/50'), '. '));
    else parts.push(h('span', {}, 'Не хватает линии ', h('b', { style: `color:${lag.cat.color}` }, `«${lag.cat.name}»`), `: отстаёт на ${pVideos(diff)}. `));
    if (zeroSubs.length) parts.push(h('span', {}, 'Ни разу не снято: ', h('b', {}, zeroSubs.map(x => x.sub.name).join(', ')), '. '));
    else parts.push('Каждая подтема закрыта хотя бы раз. ');
    if (weak.length) parts.push(h('span', {}, 'Ниже среднего по своей линии: ', h('b', {}, weak.map(x => x.sub.name).join(', ')), '.'));
    verdict.append(h('span.ic', {}, diff === 0 && !zeroSubs.length && !weak.length ? '⚖️' : '🎯'), h('span', {}, parts));
    // колонки по линиям: подтемы от самой редкой к самой частой
    for (const c of cats) {
      const col = h('div.an-col', {}, h('div.an-cat', {}, h('span.dot', { style: `background:${c.cat.color}` }), c.cat.name,
        h('span.cnt', {}, h('b', {}, c.done), ` из ${D} · норма ${fmtNum(c.expected)}`)));
      if (!c.subs.length) col.append(h('div.empty', { style: 'padding:14px' }, 'Подтем нет'));
      const scale = Math.max(1, ...c.subs.map(x => x.done), Math.ceil(c.avg));
      for (const x of [...c.subs].sort((p, q) => p.done - q.done)) {
        let tag = null;
        if (!x.done) tag = h('span.tag.zero', {}, 'ни разу');
        else if (c.judge && x.done < c.avg - .34) tag = h('span.tag.low', {}, 'мало');
        else if (c.judge && x.done > c.avg + .34) tag = h('span.tag.hi', {}, 'много');
        col.append(h('div.an-row', { title: `Открыть «${x.sub.name}» · в очереди ${pIdeas(x.queue)}`, onclick: e => openSub(x, e) },
          h('span.nm', {}, h('span', {}, x.sub.name), tag),
          h('span.n', {}, x.done),
          h('span.track', {}, h('i', { style: `width:${x.done / scale * 100}%;background:${x.color}` }),
            c.subs.length > 1 ? h('span.avg', { style: `left:${Math.min(99, c.avg / scale * 100)}%` }) : null)));
      }
      cols.append(col);
    }
    // рекомендованная последовательность
    // одинаковые подряд схлопываем: «Ваша жизнь ×3»
    const groups = [];
    for (const x of next) { const g = groups[groups.length - 1]; if (g && g.x === x) g.n++; else groups.push({ x, n: 1 }); }
    groups.forEach(({ x, n }, i) => {
      if (i) seq.append(h('span.arr', {}, '→'));
      seq.append(h('button.step', { onclick: e => openSub(x, e) },
        h('span.num', { style: `background:${x.color}` }, i + 1), x.sub.name, n > 1 ? h('b', {}, `×${n}`) : null,
        h('small', {}, x.queue ? `· ${x.queue} в очереди` : '· идей нет')));
    });
  }
  update();
  return { el, update };
}

/* ===================================================================
   Операции с идеями
   =================================================================== */
function addIdea(catId, subId, title, note) {
  const idea = { id: uid(), catId, subId, title, note: note || '', createdAt: Date.now(), updatedAt: Date.now(), done: false, doneAt: null };
  state.ideas.push(idea); commit();
  return idea;
}
function toggleDone(i) {
  i.done = !i.done; i.doneAt = i.done ? Date.now() : null; i.updatedAt = Date.now(); commit();
  if (i.done) {
    const key = nowKey(), n = doneInMonth(key).length, t = planFor(key);
    toast(t && n === t ? `🏆 ${n} из ${t} — план месяца выполнен!` : t ? `✓ Снято ${n} из ${t} в этом месяце` : `✓ Снято: ${n} в этом месяце`);
  }
}
function removeIdea(i, li) {
  const idx = state.ideas.indexOf(i);
  if (li) li.classList.add('removing');
  setTimeout(() => { const k = state.ideas.indexOf(i); if (k >= 0) { state.ideas.splice(k, 1); tombstone(i.id); commit(); } }, li ? 260 : 0);
  toast('Идея удалена', { action: 'Отменить', onAction: () => { delete state.tombstones[i.id]; i.updatedAt = Date.now(); if (!state.ideas.includes(i)) state.ideas.splice(Math.min(idx, state.ideas.length), 0, i); commit(); } });
}

let sheetOpen = false;
function openSheet(build, e) {
  if (sheetOpen) return; sheetOpen = true;
  const ov = h('div.overlay');
  const sheet = h('div.sheet');
  if (e && e.clientX) { sheet.style.setProperty('--ox', (e.clientX - (window.innerWidth - Math.min(520, window.innerWidth - 32)) / 2) + 'px'); sheet.style.setProperty('--oy', (e.clientY - window.innerHeight * .2) + 'px'); }
  const close = () => { if (!sheetOpen) return; sheetOpen = false; ov.classList.add('closing'); setTimeout(() => ov.remove(), 230); document.removeEventListener('keydown', esc); };
  const esc = ev => { if (ev.key === 'Escape') close(); };
  document.addEventListener('keydown', esc);
  ov.addEventListener('mousedown', ev => { if (ev.target === ov) close(); });
  build(sheet, close);
  ov.append(sheet); document.body.append(ov);
  return close;
}
function openAddSheet(catId, presetSub, e) {

    function drawChips() {
      chips.innerHTML = '';

        const n = ideasIn(catId, sb.id).length;
        chips.append(h('button.chip', { type: 'button', class: selected === sb.id ? 'on' : '', title: sb.hint || '', onclick: () => { selected = sb.id; err.textContent = ''; drawChips(); ta.focus(); } }, sb.name, n ? h('span.n', {}, n) : null));
      }
      const newChip = h('button.chip.new', { type: 'button' }, '+ подтема');
      newChip.onclick = () => {
        const inp = h('input.chip-input', { placeholder: 'Название подтемы' });
        newChip.replaceWith(inp); inp.focus();
        let fired = false;
        const fin = () => { if (fired) return; fired = true; const v = inp.value.trim(); if (v) { const sb = { id: uid(), name: v, shade: nextShade(c), updatedAt: Date.now() }; c.subtopics.push(sb); selected = sb.id; persist(); currentView && currentView.update(); } drawChips(); if (v) ta.focus(); };
        inp.addEventListener('keydown', ev => { if (ev.key === 'Enter') { ev.preventDefault(); fin(); } if (ev.key === 'Escape') { inp.value = ''; fin(); } });
        inp.addEventListener('blur', fin);
      };
      chips.append(newChip);
    }
    drawChips();
    const submit = () => {
      const v = ta.value.trim();
      if (!selected) { err.textContent = 'Выбери подтему — в какую «матрёшку» положить идею.'; return; }
      if (!v) { err.textContent = 'Напиши саму идею.'; ta.focus(); return; }
      addIdea(catId, selected, v, note.value.trim());

      toast(`Добавлено: ${c.name} › ${sb.name}`, { action: 'Открыть', onAction: () => go({ level: 'sub', catId, subId: selected }, { dir: 'in' }) });
    };
    ta.addEventListener('keydown', ev => { if ((ev.ctrlKey || ev.metaKey) && ev.key === 'Enter') submit(); });
    sheet.append(
      h('h3', {}, h('span.sw', { style: `background:${c.color}` }), `Новая идея · ${c.name}`),

      h('div.foot', {}, h('button.btn.secondary', { onclick: close }, 'Отмена'), h('button.btn', { onclick: submit }, 'Добавить')));

    Install.iosHint() ? h('button', { onclick: () => { closeMenu(); Install.showIosHint(); } }, h('span', {}, 'Установить на iPhone', h('small', {}, 'как добавить на экран «Домой»'))) : null,
    h('hr'),
    h('button', { onclick: () => { closeMenu(); exportJSON(); } }, h('span', {}, 'Экспорт в JSON', h('small', {}, 'резервная копия всех идей и планов'))),
    h('button', { onclick: () => { closeMenu(); importFile.click(); } }, h('span', {}, 'Импорт из JSON', h('small', {}, 'восстановить из копии'))),
    h('hr'),
    h('button.danger', { onclick: () => { closeMenu(); confirmClear(); } }, 'Очистить всё…'),
    u ? h('button', { onclick: () => { closeMenu(); Auth.logout(); } }, h('span', {}, 'Выйти из аккаунта', h('small', {}, 'данные останутся в аккаунте'))) : null);
  menuBox.innerHTML = ''; menuBox.append(dd);
});
document.addEventListener('click', e => { if (menuOpen && !e.target.closest('.menu-wrap')) closeMenu(); });

function exportJSON() {
  const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
  const a = h('a', { href: URL.createObjectURL(blob), download: `content-balance-${new Date().toISOString().slice(0, 10)}.json` });
  document.body.append(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
  toast('Файл резервной копии скачан');
}
importFile.addEventListener('change', () => {
  const f = importFile.files[0]; if (!f) return;
  const rd = new FileReader();
  rd.onload = () => {
    try {
      const s = JSON.parse(rd.result);
      if (!s || !Array.isArray(s.categories) || !Array.isArray(s.ideas)) throw 0;
      const prev = state; state = normalizeState(s); persist(); go({ level: 'home' }, { dir: 'out' });
      toast(`Импортировано: ${pIdeas(s.ideas.length)}`, { action: 'Отменить', onAction: () => { state = prev; persist(); go({ level: 'home' }, { dir: 'out' }); } });
    } catch (e) { toast('Не получилось прочитать файл — это не копия приложения'); }
    importFile.value = '';
  };
  rd.readAsText(f);
});
function confirmClear() {
  openSheet((sheet, close) => {
    sheet.append(h('h3', {}, 'Очистить всё?'),
      h('p.txt', {}, `Удалятся ${pIdeas(state.ideas.length)}, планы и подтемы. Перед этим стоит сделать экспорт.`),
      h('div.foot', {}, h('button.btn.secondary', { onclick: close }, 'Отмена'),
        h('button.btn', { style: '--accent:var(--personal)', onclick: () => { const prev = state; state = defaultState(); for (const i of prev.ideas) tombstone(i.id); for (const c of prev.categories) for (const sb of c.subtopics) tombstone(sb.id); persist(); close(); go({ level: 'home' }, { dir: 'out' }); toast('Всё очищено', { action: 'Отменить', onAction: () => { state = prev; persist(); go({ level: 'home' }, { dir: 'out' }); } }); } }, 'Очистить')));
  });
}

/* ===================================================================
   Аккаунт: регистрация и вход (Cloudflare Worker + D1)
   =================================================================== */
const API_BASE = 'https://content-balance-backend.taoo1997.workers.dev';
const AUTH_KEY = 'fuchiji-cb-auth', SYNC_KEY = 'fuchiji-cb-sync';

async function api(method, path, body, { auth = true, keepalive = false } = {}) {
  const opts = { method, headers: {}, keepalive };
  if (body !== undefined) { opts.headers['Content-Type'] = 'application/json'; opts.body = JSON.stringify(body); }
  if (auth) {
    const a = Auth.get();
    if (!a) return { ok: false, status: 401, error: 'Не авторизовано' };
    opts.headers.Authorization = 'Bearer ' + a.token;
  }
  let res;
  try { res = await fetch(API_BASE + path, opts); }
  catch (e) { return { ok: false, status: 0, networkError: true, error: 'Нет связи с сервером' }; }
  let data = null;
  try { data = await res.json(); } catch (e) {}
  if (!res.ok) return { ok: false, status: res.status, error: (data && data.error) || `Ошибка ${res.status}`, data };
  return { ok: true, status: res.status, data };
}

const Auth = {
  _a: undefined,
  get() {
    if (this._a === undefined) { try { this._a = JSON.parse(localStorage.getItem(AUTH_KEY)) || null; } catch (e) { this._a = null; } }
    return this._a;
  },
  user() { const a = this.get(); return a ? a.user : null; },
  set(a) { this._a = a; try { a ? localStorage.setItem(AUTH_KEY, JSON.stringify(a)) : localStorage.removeItem(AUTH_KEY); } catch (e) {} },
  async register(name, login, password) {
    const r = await api('POST', '/api/register', { name, login, password }, { auth: false });
    if (r.ok) this.set({ token: r.data.token, user: r.data.user });
    return r;
  },
  async login(login, password) {
    const r = await api('POST', '/api/login', { login, password }, { auth: false });
    if (r.ok) this.set({ token: r.data.token, user: r.data.user });
    return r;
  },
  async logout() {
    if (Sync.dirty) {
      Sync.setStatus('saving');
      const r = await Sync.push();
      if (!r) { toast('Не удалось отправить последние изменения — выйти можно, когда появится связь'); return; }
    }
    api('POST', '/api/logout', {}).catch(() => {});
    this.set(null);
    // локальная копия принадлежит аккаунту — на устройстве не оставляем
    state = defaultState(); save(); Sync.reset();
    document.body.querySelectorAll('.overlay').forEach(o => o.remove()); sheetOpen = false;
    showAuthScreen();
  },
  /* сессия отозвана или протухла: выходим, но локальные данные оставляем — они уйдут на сервер после входа */
  expired() { this.set(null); Sync.reset(); showAuthScreen('Сессия закончилась — войди ещё раз'); }
};

/* экран входа / регистрации */
let authEl = null;
function showAuthScreen(message) {
  document.querySelector('.app').classList.add('locked');
  if (authEl) authEl.remove();
  let mode = 'login', busy = false;
  const err = h('div.err', {}, message || '');
  const name = h('input', { placeholder: 'Как тебя зовут', autocomplete: 'name', maxlength: 80 });
  const login = h('input', { placeholder: 'email или телефон', autocomplete: 'username', inputmode: 'email' });
  const pass = h('input', { type: 'password', placeholder: 'минимум 6 символов', autocomplete: 'current-password' });
  const eye = h('button', { type: 'button', onclick: () => { pass.type = pass.type === 'password' ? 'text' : 'password'; eye.textContent = pass.type === 'password' ? 'показать' : 'скрыть'; } }, 'показать');
  const nameLbl = h('label', {}, 'Имя', name);
  const submit = h('button.btn', { type: 'submit' }, 'Войти');
  const tabs = h('div.auth-tabs');
  const form = h('form.auth-form', { onsubmit: async e => {
    e.preventDefault(); if (busy) return;
    err.textContent = '';
    const l = login.value.trim(), p = pass.value;
    if (!l) { err.textContent = 'Введи email или телефон'; login.focus(); return; }
    if (mode === 'register' && !name.value.trim()) { err.textContent = 'Введи имя'; name.focus(); return; }
    if (p.length < 6) { err.textContent = 'Пароль — минимум 6 символов'; pass.focus(); return; }
    busy = true; submit.disabled = true; submit.textContent = mode === 'login' ? 'Входим…' : 'Создаём…';
    const r = mode === 'login' ? await Auth.login(l, p) : await Auth.register(name.value.trim(), l, p);
    busy = false; submit.disabled = false; setMode(mode);
    if (!r.ok) { err.textContent = r.error; return; }
    enterApp(true);
  } }, nameLbl, h('label', {}, 'Логин', login), h('label', {}, 'Пароль', h('div.pw', {}, pass, eye)), err, submit);
  function setMode(m) {
    mode = m;
    tabs.innerHTML = '';
    tabs.append(h('button', { type: 'button', class: m === 'login' ? 'on' : '', onclick: () => setMode('login') }, 'Войти'),
      h('button', { type: 'button', class: m === 'register' ? 'on' : '', onclick: () => setMode('register') }, 'Создать аккаунт'));
    nameLbl.style.display = m === 'register' ? '' : 'none';
    pass.autocomplete = m === 'register' ? 'new-password' : 'current-password';
    submit.textContent = m === 'login' ? 'Войти' : 'Создать аккаунт';
  }
  setMode('login');
  authEl = h('div.auth', {}, h('div.auth-card', {},
    h('div.brand', {}, h('div.logo'), h('div', {}, h('h1', {}, 'Баланс контента'), h('small', {}, 'fuchiji.dance · личное ↔ экспертное'))),
    tabs, form,
    h('p.note', {}, 'Идеи и планы хранятся в аккаунте и одинаковы на всех устройствах, где ты вошёл.')));
  document.body.append(authEl);
  setTimeout(() => login.focus(), 80);
}
function enterApp(justLoggedIn) {
  if (authEl) { authEl.remove(); authEl = null; }
  document.querySelector('.app').classList.remove('locked');
  if (!currentView) go({ level: 'home' }); else rerender();
  Sync.start(justLoggedIn);
}

/* ===================================================================
   Синхронизация между устройствами
   -------------------------------------------------------------------
   На сервере лежит один JSON со всеми данными и метка версии updatedAt.
   Клиент помнит base — версию сервера, от которой отсчитаны его правки.
   PUT с устаревшим base сервер отклоняет (409) и отдаёт свою версию —
   тогда клиент сливает обе (по идеям и подтемам, с учётом удалений)
   и отправляет результат. Так правки с двух устройств не затирают друг друга.
   =================================================================== */
const Sync = {
  base: 0, dirty: false, pushing: null, timer: null, pollTimer: null, status: 'idle', rerenderPending: false,
  load() { try { const s = JSON.parse(localStorage.getItem(SYNC_KEY)); if (s) { this.base = s.base || 0; this.dirty = !!s.dirty; } } catch (e) {} },
  saveMeta() { try { localStorage.setItem(SYNC_KEY, JSON.stringify({ base: this.base, dirty: this.dirty })); } catch (e) {} },
  reset() { this.base = 0; this.dirty = false; clearTimeout(this.timer); clearInterval(this.pollTimer); this.pollTimer = null; this.saveMeta(); this.setStatus('idle'); },
  setStatus(s, text) {
    this.status = s;
    const pill = document.getElementById('syncPill');
    pill.className = 'sync ' + s;
    pill.querySelector('span').textContent = text || { idle: '…', ok: 'синхронизировано', saving: 'сохраняю…', offline: 'офлайн · сохранено на устройстве', error: 'ошибка синхронизации' }[s];
  },
  start(justLoggedIn) {
    this.load();
    if (justLoggedIn) this.firstSync(); else this.pull();
    if (!this.pollTimer) this.pollTimer = setInterval(() => { if (document.visibilityState === 'visible' && navigator.onLine) this.pull(); }, 45000);
  },
  /* сразу после входа: на устройстве могли быть идеи без аккаунта — не теряем их */
  async firstSync() {
    this.setStatus('saving');
    const r = await api('GET', '/api/data');
    const localHas = state.ideas.length > 0 || Object.keys(state.plans).length > 0;
    if (r.ok) {
      const merged = localHas ? mergeStates(state, r.data.state) : normalizeState(r.data.state);
      const changed = localHas;
      state = merged; this.base = r.data.updatedAt; this.dirty = changed; save(); this.saveMeta();
      this.requestRerender();
      if (changed) await this.push(); else this.setStatus('ok');
      if (localHas) toast('Идеи с этого устройства объединены с аккаунтом');
    } else if (r.status === 404) { this.dirty = true; this.saveMeta(); await this.push(); }
    else this.fail(r);
  },
  schedulePush() {
    if (!Auth.get()) return;
    this.dirty = true; this.saveMeta(); this.setStatus('saving');
    clearTimeout(this.timer);
    this.timer = setTimeout(() => this.push(), 900);
  },
  async push(opts = {}) {
    if (!Auth.get()) return false;
    if (this.pushing) { await this.pushing; if (!this.dirty) return true; }
    clearTimeout(this.timer);
    this.pushing = this._push(opts);
    try { return await this.pushing; } finally { this.pushing = null; }
  },
  async _push({ keepalive = false, retried = false } = {}) {
    this.setStatus('saving');
    const sentAt = state.updatedAt;
    const r = await api('PUT', '/api/data', { updatedAt: state.updatedAt, baseUpdatedAt: this.base, state }, { keepalive });
    if (r.ok) {
      this.base = r.data.updatedAt;
      if (state.updatedAt === sentAt) this.dirty = false;   // пока летело — могли поправить ещё
      this.saveMeta(); this.setStatus('ok');
      if (this.dirty) return this._push();
      return true;
    }
    if (r.status === 409 && r.data && r.data.state && !retried) {
      // на сервере уже другая версия — сливаем и отправляем результат
      state = mergeStates(state, r.data.state); this.base = r.data.updatedAt; save(); this.saveMeta();
      this.requestRerender();
      return this._push({ retried: true });
    }
    return this.fail(r);
  },
  async pull() {
    if (!Auth.get() || this.pushing) return;
    const r = await api('GET', '/api/data');
    if (r.ok) {
      if (r.data.updatedAt === this.base) { if (this.dirty) this.push(); else this.setStatus('ok'); return; }
      if (this.dirty) { state = mergeStates(state, r.data.state); this.base = r.data.updatedAt; save(); this.saveMeta(); this.requestRerender(); this.push(); return; }
      state = normalizeState(r.data.state) || state; this.base = r.data.updatedAt; save(); this.saveMeta();
      this.requestRerender(); this.setStatus('ok');
    } else if (r.status === 404) { if (state.ideas.length || this.dirty) { this.dirty = true; this.push(); } else this.setStatus('ok'); }
    else this.fail(r);
  },
  fail(r) {
    if (r.status === 401) { Auth.expired(); return false; }
    if (r.networkError) this.setStatus('offline'); else { this.setStatus('error'); toast(r.error || 'Ошибка синхронизации'); }
    return false;
  },
  async syncNow() { this.setStatus('saving'); if (this.dirty) await this.push(); await this.pull(); if (this.status === 'ok') toast('Синхронизировано'); },
  /* не дёргаем экран, пока человек печатает — перестроим, когда уйдёт фокус */
  requestRerender() {
    const a = document.activeElement, typing = a && (a.tagName === 'INPUT' || a.tagName === 'TEXTAREA') && a.closest('#stage, .overlay');
    if (!typing) { rerender(); return; }
    if (this.rerenderPending) return;
    this.rerenderPending = true;
    const done = () => { this.rerenderPending = false; if (!sheetOpen) rerender(); };
    a.addEventListener('blur', done, { once: true });
    setTimeout(() => { if (this.rerenderPending) done(); }, 30000);
  }
};

/* слияние двух версий: по идеям и подтемам берём более свежую запись, удаления учитываем через tombstones */
function mergeStates(a, b) {
  a = normalizeState(a) || defaultState(); b = normalizeState(b) || defaultState();
  const newer = (a.updatedAt || 0) >= (b.updatedAt || 0) ? a : b, older = newer === a ? b : a;
  const tomb = { ...older.tombstones };
  for (const [k, v] of Object.entries(newer.tombstones)) tomb[k] = Math.max(v, tomb[k] || 0);
  const ts = x => x.updatedAt || x.doneAt || x.createdAt || 0;
  const ideas = new Map();
  for (const i of [...older.ideas, ...newer.ideas]) { const cur = ideas.get(i.id); if (!cur || ts(i) >= ts(cur)) ideas.set(i.id, i); }
  const alive = [...ideas.values()].filter(i => !(tomb[i.id] > ts(i))).sort((x, y) => (x.createdAt || 0) - (y.createdAt || 0));
  const categories = newer.categories.map(c => {
    const oc = older.categories.find(x => x.id === c.id);
    const subs = c.subtopics.map(sb => { const o = oc && oc.subtopics.find(x => x.id === sb.id); return o && (o.updatedAt || 0) > (sb.updatedAt || 0) ? o : sb; });
    if (oc) for (const sb of oc.subtopics) if (!subs.find(x => x.id === sb.id)) subs.push(sb);
    const used = new Set(alive.filter(i => i.catId === c.id).map(i => i.subId));
    return { ...c, subtopics: subs.filter(sb => used.has(sb.id) || !(tomb[sb.id] > (sb.updatedAt || 0))) };
  });
  for (const c of older.categories) if (!categories.find(x => x.id === c.id)) categories.push(c);
  return { version: 3, categories, ideas: alive, plans: { ...older.plans, ...newer.plans }, lastPlan: newer.lastPlan ?? older.lastPlan ?? 8, tombstones: tomb, updatedAt: Date.now() };
}

/* ===================================================================
   Установка как приложения (PWA)
   =================================================================== */
const Install = {
  deferred: null,
  available() { return !!this.deferred && !this.standalone(); },
  standalone() { return matchMedia('(display-mode: standalone)').matches || navigator.standalone === true; },
  iosHint() { return /iphone|ipad|ipod/i.test(navigator.userAgent) && !this.standalone(); },
  async prompt() { if (!this.deferred) return; this.deferred.prompt(); const { outcome } = await this.deferred.userChoice; if (outcome === 'accepted') { this.deferred = null; toast('Приложение установлено'); } },
  showIosHint() {
    openSheet((sheet, close) => {
      sheet.append(h('h3', {}, 'Установить на iPhone'),
        h('p.txt', {}, '1. Открой эту страницу в Safari.', h('br'), '2. Нажми «Поделиться» (квадрат со стрелкой вверх).', h('br'), '3. Выбери «На экран „Домой“» → «Добавить».', h('br'), h('br'), 'Появится иконка, приложение откроется без адресной строки.'),
        h('div.foot', {}, h('button.btn', { onclick: close }, 'Понятно')));
    });
  }
};
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); Install.deferred = e; });
window.addEventListener('appinstalled', () => { Install.deferred = null; });
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  navigator.serviceWorker.register('./sw.js').catch(() => {});
}

/* ===================================================================
   Старт
   =================================================================== */
document.getElementById('syncPill').addEventListener('click', () => { if (Auth.get()) Sync.syncNow(); });
window.addEventListener('online', () => Auth.get() && Sync.syncNow());
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && Auth.get()) Sync.pull(); });
window.addEventListener('focus', () => Auth.get() && Sync.pull());
// при уходе со страницы досылаем несохранённое, не дожидаясь таймера
window.addEventListener('pagehide', () => { if (Auth.get() && Sync.dirty && !Sync.pushing) Sync.push({ keepalive: true }); });
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden' && Auth.get() && Sync.dirty && !Sync.pushing) Sync.push({ keepalive: true }); });

if (Auth.get()) enterApp(false); else showAuthScreen();
</script>
